.journal-app{

  /* ---- 1.1 COLOUR. Eight roles. There is no ninth. ---------------------- */

  --paper:    #F5EDE1;   /* the page */
  --paper-2:  #FBF6EE;   /* the sheet, and every flat fill laid over the graph */
  --grid:     #E4D8C7;   /* the graph rule, the binding holes, the dotted rule */
  --rule:     #6E4740;   /* every hairline, every printed label,
                            the product's own voice, the record control */
  --rule-2:   #8A6156;   /* secondary printed text and inner subdivisions */
  --block:    #364434;   /* audio, and the current destination. nothing else */
  --action-delete: #A6372D; /* user-approved red feedback for delete icons only */
  --block-2:  #B7BBA2;   /* the waveform, and text sitting on --block */
  --ink:      #2E2A25;   /* the user's words, and nothing else in the product */

  /* Measured, not carried over. Every figure recomputed for this scheme.
       --ink      on --paper      12.27      on --paper-2   13.24
       --rule     on --paper       6.85      on --paper-2    7.40
       --rule-2   on --paper       4.61      on --paper-2    4.97
       --paper    on --rule        6.85
       --paper    on --block       8.89
       --block-2  on --block       5.23
       --block    on --paper       8.89   (keyline, focus ring)
       --grid     on --paper       1.21   (decorative only, never text)

     Worst case, text sitting exactly on a graph rule:
       --ink      on --grid       10.14    allowed
       --rule     on --grid        5.66    allowed
       --block    on --grid        7.35    allowed
       --rule-2   on --grid        3.81    FORBIDDEN. see rule 2.3.

     Forbidden pairs, stated so they cannot be reached by accident:
       --ink  on --block   1.38
       --rule on --block   1.30
     Text on --block is --paper or --block-2. Never anything else. */


  /* ---- 1.2 TYPE. Three families, role-named sizes. ---------------------- */

  /* REVISION 10. Fallbacks widened for cross-device viewing. The design
     machine still resolves Constantia, Segoe UI and Ink Free, so nothing
     changes here; these only matter when a file is opened on a Mac, an
     iPhone or an Android device, which now happens because the prototype is
     shared. Georgia is the workhorse fallback and is on essentially
     everything. Bundled Lora, Source Sans 3 and Caveat provide deterministic fallbacks
     when the approved Windows faces are absent. See EXPORT-HANDOFF.md. */
  --f-prose: Constantia,"Journal Portable Prose","Palatino Linotype",Palatino,"Iowan Old Style",
             "Hoefler Text","Times New Roman",Georgia,serif;
  --f-label: "Segoe UI","Journal Portable Labels",system-ui,-apple-system,"Helvetica Neue",
             Helvetica,Arial,sans-serif;
  --f-hand:  "Ink Free","Journal Portable Hand","Segoe Script","Bradley Hand","Snell Roundhand",
             "Brush Script MT",cursive;

  /* printed, in --f-label. the product's printed layer. */
  --t-key:    10px;   /* the key in a keyline box. caps, .18em */
  --t-col:    10px;   /* the time and date column. .08em */
  --t-print:  11px;   /* destinations, chips, duration, the note's summary. caps, .07em */
  --t-quiet:  11px;   /* citation, "That's not right", the composer option. .04em */
  --t-memory: 10px;   /* user-requested compact memory control */

  /* prose, in --f-prose. */
  --t-mast:  34px;    /* the wordmark. once per screen. */
  --t-body:  16.5px;  /* the user's words. the only 16.5 in the product. */
  --t-field: 16px;    /* the composer, placeholder and value */
  --t-note:  14px;    /* the product's note. always smaller than --t-body. */
  --t-glance:13.5px;  /* the glance line */

  /* the hand, in --f-hand. at most twice per screen, never below 20px. */
  --t-hand-l:29px;    /* the value in a keyline box */
  --t-hand-s:22px;    /* the mood question */

  --lh-body:  1.58;
  --lh-note:  1.5;
  --lh-glance:1.45;
  --lh-tight: 1.3;
  --lh-flat:  1;


  /* ---- 1.3 SPACE. Nine steps, tied to the 14px graph module. ------------ */

  --s1:  2px;
  --s2:  4px;
  --s3:  6px;
  --s4:  8px;
  --s5: 10px;
  --s6: 14px;   /* THE MODULE. the page gutter and the standard inner padding. */
  --s7: 20px;
  --s8: 28px;   /* two modules */
  --s9: 42px;   /* three modules */

  /* REVISION 18. THE PAGE GUTTER IS A TOKEN, NOT A LITERAL STEP.
     Every object that sits against the edge of the page took --s6 directly:
     the masthead, the destination row, the sheet, the glance line, the total,
     the notice, the card, the progress bar, the calendar, the composer, the
     action bar, the stack, the empty state, the panel and the footer. On
     mobile the page gutter and the module are the same 14px, so writing --s6
     was harmless and read as correct.
     It is not correct. The gutter is the paper margin and the module is the
     graph. They agree at 390 by coincidence, and tablet is where they stop
     agreeing: the page becomes a defined object and needs a real margin
     around it while the module stays 14px forever.
     --gut is --s6 at mobile, so every Stage 3 file renders byte-identically.
     Verified by pixel diff, not by reading. */
  --gut: var(--s6);

  /* Fixed dimensions. Not part of the scale, not interchangeable with it. */
  --mod:  14px;   /* the graph module. same number as --s6, deliberately. */
  --rail: 24px;   /* the binding rail */
  --tcol: 58px;   /* the time column, and the date column on Timeline */
  --tap:  44px;   /* the minimum tap target. a floor, never a height to design to. */
  --ctl:  50px;   /* the record control, and the composer field */

  /* REVISION 47. FOUR NATIVE DIMENSIONS, FOR SECTION 6. They are declared here
     with --rail, --tcol, --tap and --ctl because they are the same kind of
     object: a fixed dimension that is not part of the spacing scale and is not
     interchangeable with it. They are unused on the three web platforms,
     exactly as --page-w is unused below the tablet threshold.
     ALL FOUR ARE APPLE'S OWN NUMBERS, NOT DERIVED BY THIS PROJECT, because a
     native pass that invents its own furniture heights is a wrapper with
     opinions. In a real build the two safe areas are env() values and are
     never typed; they are typed here because a comp has no device to ask.
     ONE OF THEM WAS ALREADY IN THIS FILE. --tap has been 44px since the Stage 2
     lock, chosen off WCAG, and iOS specifies 44pt for the same thing. The
     accessibility floor this project has built to for three platforms is the
     native platform's own number, so nothing had to move to meet it. */
  --safe-t: 47px; /* the status bar. iPhone 12/13/14 class, 390x844.
                     PRODUCTION: env(safe-area-inset-top). */
  --safe-b: 34px; /* the home indicator. PRODUCTION: env(safe-area-inset-bottom). */
  --tabh:   49px; /* the UITabBar item row, above the home indicator. The bar's
                     total height is --tabh + --safe-b, which is 83. */
  --navh:   44px; /* the COLLAPSED navigation bar, once the large title has gone.
                     The same number as --tap, and that is a coincidence rather
                     than a derivation: one is a floor and one is a bar height. */
  --page-w: 560px; /* REVISION 19. The width of the page at tablet and above.
                      EXACTLY 40 GRAPH MODULES, so the ruling lands on the
                      page's own edge instead of being cut mid-square. Unused
                      below the tablet threshold, where the page is the
                      viewport and has no width of its own. */


  /* ---- 1.4 RADIUS. One value. -------------------------------------------- */

  --r: 2px;   /* everything. controls included. paper does not round. */


  /* ---- 1.5 RULE. One weight. ------------------------------------------- */

  --w: 1px;   /* every rule in the product is 1px. there is no second weight.
                 rules are told apart by colour and style, never by thickness. */


  /* ---- 1.6 ELEVATION. There is none. ------------------------------------ */

  --elev: none;   /* no box-shadow on any product surface, at any state.
                     hierarchy comes from rules, fills and leading. paper does
                     not float. the only shadow in this project is on .device,
                     which is presentation furniture and does not ship. */
}


/* ==========================================================================
   2. BASE
   ========================================================================== */

.journal-app, .journal-app *{box-sizing:border-box;margin:0;padding:0}
.journal-app{-webkit-text-size-adjust:100%}


/* ---- 2.2 Focus. One treatment, product-wide. -------------------------- */

.journal-app a:focus-visible,.journal-app button:focus-visible,.journal-app summary:focus-visible,.journal-app input:focus-visible,.journal-app textarea:focus-visible,.journal-app select:focus-visible,.journal-app [tabindex]:focus-visible{
  outline:2px solid var(--block);outline-offset:2px}


/* ---- 2.2b Pressed. One treatment, product-wide. REVISION 38. ----------
   A control the pointer presses should move under it. The product has had
   hover and focus since Stage 2 and has never had a pressed state, which was
   a real gap at the first platform with a real pointer.
   IT LANDS ON ALL FIVE PLATFORMS BECAUSE IT IS COMPONENT BEHAVIOUR RATHER
   THAN DESKTOP LAYOUT, which is the same reason revisions 27 to 29 and 31
   landed everywhere. A thumb presses too. direction-lock.md 7.5.
   1px, transform only, so it costs no layout and repaints nothing but the
   control itself. IT CHANGES NO COMP: states are drawn at rest, so :active
   never fires in a screenshot and all 28 approved renders are untouched.
   prefers-reduced-motion is deliberately not consulted: this is a state, not
   a transition. There is nothing to shorten and nothing that eases. */
.journal-app .dest a:active,.journal-app .chips button:active,.journal-app .play:active,.journal-app .mic:active,.journal-app .send:active,.journal-app .btn:active,.journal-app .cite:active,.journal-app .wrong:active,.journal-app .opt:active,.journal-app .said summary:active,.journal-app .seg button:active,.journal-app .seg a:active,.journal-app .back:active,.journal-app .cal .day.has:active{
  transform:translateY(1px)}


/* ---- 2.3 The graph ground, and what may sit on it.
          Text over the graph is --ink, --rule or --block. Never --rule-2,
          which falls to 3.81:1 where it crosses a rule. Any surface that
          carries --rule-2 text must first lay down a flat fill. ---------- */


/* ==========================================================================
   3. COMPONENTS
   The inventory is closed. Anything not below does not get built in Stage 3.
   ========================================================================== */

/* ---- A. SHELL -------------------------------------------------------- */

/* A2 the page shell */
.journal-app .app{background:var(--paper);min-height:764px;color:var(--ink);
     display:flex;flex-direction:column;position:relative;padding-left:var(--rail)}
/* REVISION 6. The states pack shows many states of the same screen, and a
   full 764px viewport for each would make the file unreadable. Presentation
   only: no shipped screen uses this. */
.journal-app .app.clip{min-height:0}

/* A3 the binding rail. decorative, aria-hidden, no tap area, every screen. */
.journal-app .rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);
      background-color:var(--paper-2);
      background-image:radial-gradient(circle at 12px 21px,var(--grid) 0 5px,transparent 5.5px);
      background-size:var(--rail) 42px;background-repeat:repeat-y;
      border-right:var(--w) solid var(--rule-2)}

/* the graph page */
.journal-app .page{flex:1 1 auto;display:flex;flex-direction:column;
      background-image:
        repeating-linear-gradient(to right,var(--grid) 0 1px,transparent 1px var(--mod)),
        repeating-linear-gradient(to bottom,var(--grid) 0 1px,transparent 1px var(--mod))}

/* A4 the masthead.
   REVISION 17. THE MASTHEAD IS THE SAME HEIGHT ON EVERY DESTINATION, so the
   destination row and everything under it never move when you switch.
   It was not. The second row of the masthead is a different object on each
   destination and each had its own natural height:
     Today and You   .keybox           48px
     Timeline        .seg              46px
     Ask             .crow .field      50px
   which put the destination row at 186, 184 and 188. Switching destinations
   nudged the whole page by up to 4px, which reads as the interface twitching
   rather than as anything intentional.
   All three are now pinned to --ctl, the height the composer control already
   uses, so nothing had to shrink to agree.
   This applies to DESTINATIONS. A pushed page carries a back control above the
   wordmark and is legitimately taller. */
.journal-app .mast{padding:var(--s7) var(--gut) var(--s5)}
.journal-app .mast > .keybox,.journal-app .mast > .seg,.journal-app .mast > .crow{min-height:var(--ctl)}
/* REVISION 48. THE WEIGHT IS DECLARED HERE RATHER THAN IN A PLATFORM BLOCK,
   BECAUSE IT WAS NEVER A PLATFORM FACT. .wordmark is the h1 on every screen
   that has one, and an h1 is bold by default, so a scale with no weight axis
   was getting one from the browser. Section 5 declared this desktop only and
   section 6 declared it again for native, both by client decision while 390
   and 834 were frozen; the client lifted that at session 10 and both copies
   are gone. See 9.14 and the polish pass. */
.journal-app .wordmark{font-family:var(--f-prose);font-size:var(--t-mast);line-height:var(--lh-flat);
          font-weight:400;
          color:var(--rule);letter-spacing:-.015em;margin-bottom:var(--s5)}


/* ---- B. NAVIGATION --------------------------------------------------- */

/* B1 the destination row. four items, always four, every screen.
   REVISION 28. YOU IS SET APART FROM THE OTHER THREE, ON EVERY PLATFORM.
   The four were equal-width tabs dividing the row, which said all four are the
   same kind of place. They are not. Today, Timeline and Ask are the journal;
   You is the account, and it is the only one of the four that is about the
   software rather than about the writing. An auto left margin on the last item
   states that in the layout instead of leaving it to be learned.
   The three take their own width now rather than a quarter of the row each,
   which is what makes the gap before You readable as a gap. Order is unchanged
   and is still Today, Timeline, Ask, You. Still always four. */
.journal-app .dest{display:flex;gap:var(--s3);padding:0 var(--gut) var(--s6)}
.journal-app .dest a:last-child{margin-left:auto}
.journal-app .dest a{flex:0 1 auto;padding:0 var(--s6);min-height:var(--tap);min-width:var(--tap);
        display:inline-flex;align-items:center;justify-content:center;
        font-size:var(--t-print);letter-spacing:.07em;text-transform:uppercase;
        color:var(--rule);text-decoration:none;background:var(--paper-2);
        border:var(--w) solid var(--rule-2);border-radius:var(--r)}
.journal-app .dest a[aria-current="page"]{background:var(--block);border-color:var(--block);color:var(--paper)}
.journal-app .dest a:hover:not([aria-current]){border-color:var(--rule)}

/* B2 the segmented control. Timeline zoom only. Never anything else. */
.journal-app .seg{display:inline-flex;min-height:var(--ctl);
     border:var(--w) solid var(--rule);border-radius:var(--r);
     background:var(--paper-2);overflow:hidden}
/* element-agnostic: a real zoom control is a button, but a no-script
   prototype needs links. Both render identically. */
/* the container carries the height; align-items:stretch fills the children
   to its content box. Giving the CHILDREN --ctl pushed the container to 52,
   because their min-height sits inside its 1px borders. */
.journal-app .seg button,.journal-app .seg a{min-height:var(--tap);padding:0 var(--s6);border:0;cursor:pointer;
            display:inline-flex;align-items:center;text-decoration:none;
            font-family:var(--f-label);font-size:var(--t-print);letter-spacing:.07em;
            text-transform:uppercase;color:var(--rule);background:var(--paper-2)}
.journal-app .seg button + button,.journal-app .seg a + a{border-left:var(--w) solid var(--rule)}
.journal-app .seg button[aria-pressed="true"],.journal-app .seg a[aria-current]{background:var(--rule);color:var(--paper)}

/* B3 page back. pushed pages only, never a destination. */
.journal-app .back{display:inline-flex;align-items:center;gap:var(--s3);min-height:var(--tap);min-width:var(--tap);
      font-size:var(--t-print);letter-spacing:.07em;text-transform:uppercase;
      color:var(--rule);text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.journal-app .back svg{width:14px;height:14px}
.journal-app .back:hover{color:var(--block)}


/* ---- C. THE FORM ----------------------------------------------------- */

/* C1 the sheet. one rectangle, hairline-ruled into rows. */
.journal-app .sheet{margin:0 var(--gut) var(--s6);border:var(--w) solid var(--rule);
       border-radius:var(--r);background:var(--paper-2);overflow:hidden}
.journal-app .sheet > * + *{border-top:var(--w) solid var(--rule)}

/* C2 a ruled row. the 58px column carries the time, or on Timeline the date. */
.journal-app .srow{display:flex;align-items:stretch}
.journal-app .srow .tcol{flex:0 0 var(--tcol);border-right:var(--w) solid var(--rule-2);
            padding:var(--s6) var(--s4) 0 0;text-align:right;
            font-size:var(--t-col);letter-spacing:.08em;color:var(--rule-2);
            line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.journal-app .srow .ccol{flex:1 1 auto;padding:var(--s5) var(--s6) var(--s6);min-width:0}

/* the user's words. the highest-status content on every screen. */
.journal-app .prose{font-family:var(--f-prose);font-size:var(--t-body);line-height:var(--lh-body);
       color:var(--ink)}

/* C3 the recording row. the only row that fills with colour.
   REVISION 29. THE RECORDING IS INVERTED. --block-2 GROUND, --block MARKS.
   It was --block ground with --block-2 marks, which made a solid #364434 slab
   the loudest object on every screen it appeared on. At 390 that was strong;
   at 834 the same row is 504px wide and it simply took the page. The brief's
   first content rule is that THE USER'S OWN WORDS ARE THE HIGHEST-STATUS
   CONTENT ON EVERY SCREEN, and a memo nobody has played was outshouting the
   writing above it.
   The fix is a straight swap between two roles that already exist, so there is
   no ninth colour and the palette is untouched:
     ground     --block   ->  --block-2
     waveform   --block-2 ->  --block
     duration   --block-2 ->  --block
     play       --paper fill, --block glyph  ->  --paper-2 fill, --block keyline
   RULE 2 STILL HOLDS. --block marks audio and only audio; it now does it with
   the waveform, the duration, the play control's keyline and the divider rule
   rather than with a slab. RULE 2.4 STILL HOLDS: a recording is told from a
   typed entry by a filled row, a waveform, a duration and a play control, and
   all four survive. So does greyscale: the row is 0.482 relative luminance
   against the sheet's 0.926, which is plainly the one toned band on the page.
   Contrast, recomputed rather than carried over:
     --block    on --block-2    5.23   waveform, duration, play keyline
     --ink      on --block-2    7.22   (the calendar's audio day)
     --block    on --paper-2    9.60   the play glyph, the divider
     --paper    on --block      8.89   the play glyph on hover
   The row's own edge is not carried by the fill and never was: .sheet draws a
   --rule hairline between every row, at 6.85. */
.journal-app .recrow{background:var(--block-2);padding:0}
.journal-app .recrow .head{display:flex;align-items:center;gap:var(--s6);padding:var(--s6)}
.journal-app .recrow .body{background:var(--paper-2);border-top:var(--w) solid var(--block);
              display:flex;align-items:stretch}
.journal-app .recrow .body .tcol{flex:0 0 var(--tcol);border-right:var(--w) solid var(--rule-2);
                    padding:var(--s6) var(--s4) 0 0;text-align:right;
                    font-size:var(--t-col);letter-spacing:.08em;color:var(--rule-2);
                    line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.journal-app .recrow .body .ccol{flex:1 1 auto;padding:var(--s5) var(--s6) var(--s6);min-width:0}
.journal-app .dur{flex:0 0 auto;font-size:var(--t-print);letter-spacing:.08em;color:var(--block);
     font-variant-numeric:tabular-nums}

/* REVISION 31. A RECORDING ROW CAN CARRY ITS OWN DATE COLUMN.
   00-flow.md section 1 specifies the object outright: "A memo row is date,
   duration, waveform, play control." As built, a memo row carried its date
   only when a Pro transcript body existed to hold it. Timeline is drawn at
   Free, so there is no body and there was no date, and the file's own comment
   states the convention that an undated row continues the day above. That
   silently reassigned Saturday 8th's recording to Sunday 9th and Wednesday
   5th's to Thursday 6th, while the CALENDAR ZOOM ON THE SAME SCREEN tones
   the 5th and the 8th and leaves the 6th keyline only. One screen, two zooms,
   two different accounts of the record. The play control's aria-label carried
   the right date throughout, so a screen reader was told the truth and a
   sighted reader was not.
   The column takes --paper-2, exactly as .recrow .body .tcol does, for two
   reasons and the second is the better one: --rule-2 on --paper-2 is the
   measured 4.97 and needs NO NEW CONTRAST FIGURE, and it restores rule 4,
   "times in a fixed 58px left column", which the recording head was the only
   row in the product to break.
   THE ROW'S HEIGHT DOES NOT MOVE: the content column is still play plus 2x
   --s6, which is 72, and the date is shorter than that.
   THE WAVEFORM DOES MOVE, and it is not optional to follow it. .wave is
   preserveAspectRatio="none", so taking 59px out of the row rescales every
   tick. Section 12.7 holds tick weight at 1.769px, so every wave in a dated
   row is re-authored to the narrower measure. See direction-lock.md 12.7. */
.journal-app .recrow .head.dated{align-items:stretch;gap:0;padding:0}
.journal-app .recrow .head.dated > .tcol{flex:0 0 var(--tcol);background:var(--paper-2);
     border-right:var(--w) solid var(--rule-2);
     padding:var(--s6) var(--s4) var(--s6) 0;text-align:right;
     font-size:var(--t-col);letter-spacing:.08em;color:var(--rule-2);
     line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.journal-app .recrow .head.dated > .ccol{flex:1 1 auto;min-width:0;
     display:flex;align-items:center;gap:var(--s6);padding:var(--s6)}

/* C4 the product's note. shut until you open it. details/summary, no script. */
.journal-app .said{display:flex;align-items:stretch;background:var(--paper)}
/* REVISION 48. THE COLLAPSED NOTE ROW IS CENTRED IN BOTH COLUMNS, ON EVERY
   PLATFORM. 9.14 defect 4, and it was always a component fault rather than a
   desktop one: padding-top --s6 against padding-bottom 0 is right for an OPEN
   note, where the printed key labels the top of a long block, and wrong for a
   SHUT one, where the row is only as tall as the key itself. Measured before:
   the key sat 14 above and 0.0 below, touching the hairline under it, in a row
   of 54. Now 14 and 14 in a row of 68, which is what 1440 and native have
   measured since they were fixed there.
   SCOPED TO :not(.open) ON PURPOSE. The expanded state is right as it is. */
.journal-app .said .tcol{flex:0 0 var(--tcol);border-right:var(--w) solid var(--rule-2);
            padding:var(--s6) var(--s4) var(--s6) 0;text-align:right;
            font-size:var(--t-col);letter-spacing:.11em;text-transform:uppercase;
            color:var(--rule-2);line-height:var(--lh-tight)}
.journal-app .said .ccol{flex:1 1 auto;padding:var(--s1) var(--s6) var(--s2);min-width:0}
.journal-app .said .ccol:not(.open){display:flex;flex-direction:column;
                       justify-content:center;padding:var(--s2) var(--s6)}
/* REVISION 5. On /ask/{id} and on a reflection the product is answering a
   question the user actually asked, so the note is shown rather than shut.
   Collapsing an answer somebody requested would be perverse. Same row, same
   colour, same subordinate size. No summary, so the padding is the normal
   row padding rather than the tight one a 44px summary needs. */
.journal-app .said .ccol.open{padding:var(--s5) var(--s6) var(--s6)}
.journal-app .said .ccol.open .note{border-top:0;margin-top:0;padding-top:0}
.journal-app .said summary{list-style:none;display:flex;align-items:center;justify-content:space-between;
              gap:var(--s5);min-height:var(--tap);cursor:pointer;
              font-size:var(--t-print);letter-spacing:.1em;text-transform:uppercase;
              color:var(--rule-2)}
.journal-app .said summary::-webkit-details-marker{display:none}
.journal-app .said summary:hover{color:var(--block)}
.journal-app .said .chev{width:14px;height:14px;flex:0 0 auto}
.journal-app .said details[open] .chev{transform:rotate(180deg)}
.journal-app .said .lbl.open{display:none}
.journal-app .said details[open] .lbl.shut{display:none}
.journal-app .said details[open] .lbl.open{display:inline}
.journal-app .said details[open] summary{color:var(--rule)}
.journal-app .said .note{padding:var(--s2) 0 var(--s1);border-top:var(--w) dotted var(--grid);
            margin-top:var(--s1)}
.journal-app .said p{font-family:var(--f-prose);font-size:var(--t-note);line-height:var(--lh-note);
        color:var(--rule);max-width:32ch}
.journal-app .said-foot{display:flex;align-items:center;gap:var(--s6)}

/* C5 the mood row. words. five of them. the last row of the form. */
.journal-app .moodrow{padding:var(--s6)}
/* REVISION 48. THE WEIGHT IS DECLARED. 9.14 defect 2, and it is the one of the
   four that was a rendering fault rather than a preference: this rule sets
   family, size, line height, colour and margin and never set a weight, so the
   browser's heading default leaked and THE ONE HAND SET QUESTION IN THE PRODUCT
   HAS BEEN DRAWING IN SYNTHESISED BOLD INK FREE SINCE STAGE 1. Ink Free has no
   bold, so the browser was manufacturing one. A script face hid it for six
   sessions. direction-lock 3.1 has no weight axis at all. */
.journal-app .moodrow h2{font-family:var(--f-hand);font-size:var(--t-hand-s);line-height:1.1;
            font-weight:400;
            color:var(--rule);margin-bottom:var(--s5)}
.journal-app .chips{display:flex;gap:var(--s3)}
.journal-app .chips button{flex:1 1 0;min-height:var(--tap);padding:0 var(--s1);
              font-family:var(--f-label);font-size:var(--t-print);letter-spacing:.04em;
              color:var(--rule);background:var(--paper);
              border:var(--w) solid var(--rule-2);border-radius:var(--r);cursor:pointer}
.journal-app .chips button:hover{background:var(--block-2);border-color:var(--block);color:var(--block)}
.journal-app .chips button[aria-pressed="true"]{background:var(--rule);border-color:var(--rule);
                                   color:var(--paper)}


/* ---- D. PRINTED OBJECTS ---------------------------------------------- */

/* D1 the keyline box. printed caps key, written value. every date the
      product shows. also the price on /you/plan. */
.journal-app .keybox{display:flex;align-items:stretch;min-height:var(--ctl);
        border:var(--w) solid var(--rule);
        border-radius:var(--r);background:var(--paper-2);overflow:hidden}
.journal-app .keybox .k{display:flex;align-items:center;padding:0 var(--s5);
           background:var(--rule);color:var(--paper);font-size:var(--t-key);
           letter-spacing:.18em;text-transform:uppercase}
/* REVISION 48. The weight, for the same reason .wordmark takes it: on /talk, on
   an answer and on a past day there is no wordmark, so the date box IS the
   object that names the page and becomes the h1. Revision 42 made that argument
   at desktop; it is not a desktop fact and now sits in the base. */
.journal-app .keybox .v{font-family:var(--f-hand);font-size:var(--t-hand-l);line-height:var(--lh-flat);
           font-weight:400;
           color:var(--rule);padding:9px var(--s6) var(--s4)}
/* printed variant, used when the hand has already appeared twice.
   Vertical padding is 0 and the box centres instead: with padding the content
   came to 50.8px and broke the fixed masthead height by eight tenths of a
   pixel, which is invisible on one screen and a visible twitch when you
   switch between screens. */
.journal-app .keybox .v.printed{display:flex;align-items:center;
                   font-family:var(--f-prose);font-size:var(--t-field);
                   line-height:var(--lh-tight);padding:0 var(--s6)}

/* D2 the glance line. printed between two rules. */
/* REVISION 48. The weight, same reason again: .glance can be the h1 on a screen
   with no wordmark and no date box. */
.journal-app .glance{margin:0 var(--gut) var(--s6);padding:var(--s4) 0;
        border-top:var(--w) solid var(--rule);border-bottom:var(--w) solid var(--rule);
        font-family:var(--f-prose);font-size:var(--t-glance);line-height:var(--lh-glance);
        font-weight:400;
        color:var(--rule)}

/* D3 the total. the only number in the product. Timeline only. It only rises.
      No badge, no colour, no countdown, no urgency, ever. */
.journal-app .total{margin:0 var(--gut) var(--s6);padding:var(--s5) 0;
       border-top:var(--w) solid var(--rule);border-bottom:var(--w) solid var(--rule);
       font-family:var(--f-prose);font-size:var(--t-glance);line-height:var(--lh-glance);
       color:var(--ink);font-variant-numeric:tabular-nums}
.journal-app .total a{color:var(--rule);text-decoration:underline;text-underline-offset:3px}

/* D4 an item mark. Private, Imported, Saved on this device.
      Never colour alone. Always a keyline and a word. */
.journal-app .mark{display:inline-flex;align-items:center;gap:var(--s3);
      padding:var(--s1) var(--s3);border:var(--w) solid var(--rule-2);
      border-radius:var(--r);background:var(--paper);
      font-size:var(--t-key);letter-spacing:.14em;text-transform:uppercase;
      color:var(--rule-2);line-height:1.6}
.journal-app .mark svg{width:11px;height:11px;flex:0 0 auto}
/* REVISION 1, found building Stage 3 screen 1. A mark that follows the user's
   words needs to clear them. An adjacency rule, not a new component. */
.journal-app .prose + .mark,.journal-app .lede + .mark{margin-top:var(--s4)}

/* D6 a section heading inside the form. REVISION 2, found building Stage 3.
   Timeline needs month headings, Ask needs result groups, You and Plan need
   section breaks. Carries its own fill and is --rule, so it is safe anywhere.
   This is a genuine thirty third component, not an adjacency rule. */
/* REVISION 48, AND THIS ONE IS 9.17. .shead is an h2 in the markup and never
   set a weight, so it computed 700 while every other object on --t-key computed
   400: .keybox .k, .mark and .dur are all spans and all 400. ONE TOKEN WAS
   RENDERING AT TWO WEIGHTS AND THE ELEMENT WAS DECIDING WHICH, in a scale
   direction-lock 3.1 states has no weight axis.
   IT WAS RAISED AS A DECISION RATHER THAN A DEFECT AND THE CLIENT TOOK IT.
   Unlike defect 2 this was not a synthesised bold, because Segoe UI has a real
   one, so it had looked deliberate for 47 revisions and had passed every review
   this project ran. What settled it is that 3.1 is the binding document: 400 is
   what the scale specifies, and keeping the bold would have meant ADDING A
   WEIGHT AXIS to 3.1, which is the larger change and would have had to be
   argued rather than inherited from a browser default. */
.journal-app .shead{padding:var(--s5) var(--s6);background:var(--paper);
       font-size:var(--t-key);letter-spacing:.18em;text-transform:uppercase;
       font-weight:400;
       color:var(--rule)}

/* the footer line. --rule, not --rule-2, because it sits on the open graph
   ground where --rule-2 falls to 3.81:1. See rule 2.3. */
.journal-app .foot{padding:0 var(--gut) var(--s7);font-size:var(--t-quiet);letter-spacing:.04em;
      color:var(--rule)}


/* ---- E. CONTROLS ----------------------------------------------------- */

/* E1 the composer. sticky, the foot of Today, never on any other screen. */
.journal-app .composer{margin-top:auto;position:sticky;bottom:0;background:var(--paper);
          border-top:var(--w) solid var(--rule);padding:var(--s6) var(--gut) var(--s7)}
.journal-app .crow{display:flex;align-items:center;gap:var(--s5)}
/* V3 composer overflow occupies the option's existing row, preserving its travel. */
.journal-app .composer-tools{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.journal-app .composer-tools .btn.quiet{flex:0 0 auto}

/* REVISION 27. THE SEARCH ROW LEAVES THE MASTHEAD.
   Ask used to carry its field as the masthead's second row, beside the
   wordmark. Two things were wrong with it and the second is the real one.
   First, at 834 the masthead is a single row, so the field had to be capped at
   360 to stop it dominating, and a search box that is deliberately prevented
   from being the width of its results is an odd object.
   Second, and this is the argument: on every other destination the masthead's
   second row is a PRINTED OBJECT the product is telling you about, a date or a
   zoom control. On Ask it was the only interactive text input in any masthead
   in the product. Ask now carries the same date box as Today and You, so all
   four destinations compose their masthead identically, and rule 7.6 holds for
   a better reason than that all three objects happened to be --ctl tall.
   The field moves below the destination row and fills the page, which is where
   a search box goes and what it should be the width of.
   Same component, same .crow, one added margin. No new component. */
.journal-app .crow.find{margin:0 var(--gut) var(--s6)}

/* E3 the field */
/* REVISION 11. text-decoration:none because the prototype makes the field a
   link to be tappable, and a text field is never underlined. */
.journal-app .field{flex:1 1 auto;min-height:var(--ctl);display:flex;align-items:center;text-decoration:none;
       padding:0 var(--s6);background:var(--paper-2);
       border:var(--w) solid var(--rule-2);border-radius:var(--r);
       font-family:var(--f-prose);font-size:var(--t-field);color:var(--ink)}
.journal-app .field.placeholder{color:var(--rule-2)}

/* REVISION 12, and the fix for the one blocking flow defect.
   ONE CONTROL, TWO STATES. The composer's single filled control is the record
   control while the field is empty, and the commit control the moment it is
   not. Same box, same size, same fill, different glyph and different label.

   Why not a third permanent button: the empty state is most of the life of
   this screen, and a send button sitting dead in it is a control that is
   wrong more often than it is right.

   Why the mic goes away mid-draft: accepted, and it is the one real cost.
   Someone with half a sentence typed who then wants to record has to clear
   the field first. That is rare, it is recoverable, and it buys the two-tap
   typed path that 00-flow.md section 3.3 requires.

   Both are --rule, not --block, because they are the product acting.
   --block marks audio that exists, never the act of making it. */
.journal-app .mic{flex:0 0 auto;width:var(--ctl);height:var(--ctl);border-radius:var(--r);
     background:var(--rule);border:0;color:var(--paper);cursor:pointer;
     display:grid;place-items:center;text-decoration:none}
.journal-app .mic svg{width:22px;height:22px}

/* REVISION 13. The commit control is a WORD, not a glyph.
   It was an arrow down onto a baseline, and the first person to look at it read
   it as download, which is the one thing it must not mean. An icon that has to
   be decoded is worse than a word that cannot be, and this product already
   speaks in printed labels: Upgrade, Export, Not now. Save belongs with those.
   It also gives the control a real accessible name instead of one bolted on
   with aria-label, and it survives a user who has never seen the icon before. */
.journal-app .send{flex:0 0 auto;min-height:var(--ctl);padding:0 var(--s6);border-radius:var(--r);
      background:var(--rule);border:0;color:var(--paper);cursor:pointer;
      display:inline-flex;align-items:center;justify-content:center;
      font-family:var(--f-label);font-size:var(--t-print);letter-spacing:.07em;
      text-transform:uppercase;text-decoration:none;white-space:nowrap}

.journal-app .mic:hover,.journal-app .send:hover{background:var(--block)}

/* E2 buttons. three grades and no fourth. */
.journal-app .btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s3);
     min-height:var(--tap);padding:0 var(--s6);border-radius:var(--r);
     font-family:var(--f-label);font-size:var(--t-print);letter-spacing:.07em;
     text-transform:uppercase;cursor:pointer;text-decoration:none}
.journal-app .btn.solid{background:var(--rule);color:var(--paper);border:var(--w) solid var(--rule)}
.journal-app .btn.solid:hover{background:var(--block);border-color:var(--block)}
.journal-app .btn.keyline{background:var(--paper-2);color:var(--rule);border:var(--w) solid var(--rule-2)}
.journal-app .btn.keyline:hover{border-color:var(--rule)}
/* quiet is --rule, not --rule-2. It can be placed on the open graph ground,
   where --rule-2 fails, and a control the user is meant to press should not be
   the least legible thing on the page. */
.journal-app .btn.quiet{background:none;border:0;padding:0;min-width:var(--tap);text-transform:none;letter-spacing:.04em;
           font-size:var(--t-quiet);color:var(--rule);
           text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.journal-app .btn.quiet:hover{color:var(--block)}

/* the citation, and the way to say it is wrong. always together. */
/* REVISION 9. Short labels made these 31px and 39px wide. Height was always
   44; width was not. min-width extends the hit area into the flex gap without
   extending the underline, which only draws under the text itself. */
.journal-app .cite,.journal-app .wrong{font-family:var(--f-label);font-size:var(--t-quiet);letter-spacing:.04em;
             min-height:var(--tap);min-width:var(--tap);
             display:inline-flex;align-items:center;
             background:none;border:0;cursor:pointer;padding:0}
.journal-app .cite{color:var(--rule);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.journal-app .wrong{color:var(--rule-2);text-decoration:underline;text-decoration-style:dotted;
       text-underline-offset:3px}
.journal-app .cite:hover,.journal-app .wrong:hover{color:var(--block)}

/* the checkable option. out of memory, and settings toggles. */
.journal-app .opt{display:inline-flex;align-items:center;gap:var(--s4);margin-top:var(--s3);
     min-height:var(--tap);font-size:var(--t-quiet);letter-spacing:.05em;
     color:var(--rule-2);background:none;border:0;cursor:pointer;padding:0}
.journal-app .opt .tick{width:14px;height:14px;flex:0 0 auto;border:var(--w) solid var(--rule-2);
           border-radius:var(--r);background:var(--paper-2)}
.journal-app .opt[aria-pressed="true"] .tick{background:var(--rule);border-color:var(--rule)}
.journal-app .opt:hover{color:var(--rule)}

/* E4 the play control */
.journal-app .play{flex:0 0 auto;width:var(--tap);height:var(--tap);border-radius:var(--r);
      background:var(--paper-2);border:var(--w) solid var(--block);color:var(--block);
      cursor:pointer;display:grid;place-items:center}
.journal-app .play svg{width:15px;height:15px;margin-left:2px}
.journal-app .play:hover{background:var(--block);color:var(--paper)}

/* E5 the waveform. authored SVG, decorative, aria-hidden.
      The duration beside it carries the information. */
.journal-app .wave{flex:1 1 auto;min-width:0;height:var(--tap);display:block;color:var(--block)}
/* REVISION 4a. /talk is one job on a full screen, so its waveform is the
   object rather than a detail of a row. Same mark, same colour, more height. */
.journal-app .wave.big{height:96px;width:100%}

/* E7 a large printed readout. REVISION 4b. The elapsed time on /talk and the
   backlog figure on /you/plan are the only two numbers the product states at
   size, and neither may be in the hand: rule 8 forbids the hand carrying
   information that is not also printed nearby, and these have no printed
   twin. Prose face, --rule, tabular. */
.journal-app .readout{font-family:var(--f-prose);font-size:var(--t-mast);line-height:var(--lh-flat);
         color:var(--rule);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* E8 a centred single-purpose block. REVISION 4c. /talk and first run are
   full-screen pages with one job and no form to sit in. */
.journal-app .stack{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:var(--s7);padding:var(--s9) var(--gut);text-align:center}
.journal-app .stack .row{display:flex;align-items:center;justify-content:center;gap:var(--s6)}
/* inside a stack a block is the full column and owns its own margins */
.journal-app .stack .recrow{width:100%;border-radius:var(--r)}
/* REVISION 15. A stack centres its own short lines, but a card inside one
   holds real prose, and centred multi-line prose is bad typography and
   inconsistent with every other card in the product. Reset the alignment. */
.journal-app .stack .notice,.journal-app .stack .card{margin:0;width:100%;text-align:left}
/* the capture head stacks, because the waveform is the object and not a detail */
.journal-app .recrow .head.col{flex-direction:column;gap:var(--s6)}

/* E6 a settings row. label, value, and one sentence of explanation.
   Carries its own flat fill, because the value is --rule-2 and the row is
   often placed on the open graph ground. Top-aligned, so the value sits with
   the label rather than floating against the middle of a two-line block. */
.journal-app .srowlink{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s6);
          min-height:var(--tap);padding:var(--s6);text-decoration:none;color:var(--ink);
          background:var(--paper-2)}
.journal-app .srowlink .lab{flex:1 1 auto;min-width:0;
               font-family:var(--f-prose);font-size:var(--t-field);color:var(--ink)}
.journal-app .srowlink .val{flex:0 1 auto;text-align:right;
               font-size:var(--t-quiet);letter-spacing:.04em;
               color:var(--rule-2);line-height:var(--lh-body)}

/* E9 a page action bar. REVISION 8. /you/plan ends in two buttons and the
   composer is not allowed to leave Today, so it needed its own foot. Same
   rule above it, same gutter, no stickiness: this is the end of a page you
   scrolled, not a control that follows you. */
.journal-app .actions{display:flex;align-items:center;gap:var(--s5);
         padding:var(--s6) var(--gut) var(--s7);background:var(--paper);
         border-top:var(--w) solid var(--rule)}
.journal-app .srowlink .why{display:block;font-family:var(--f-prose);font-size:var(--t-note);
               line-height:var(--lh-note);color:var(--rule);margin-top:var(--s2);
               max-width:38ch}


/* ---- F. NOTICES ------------------------------------------------------ */

/* F1 an inline notice. offline, guest, allowance. never touches history. */
.journal-app .notice{margin:0 var(--gut) var(--s6);padding:var(--s5) var(--s6);
        background:var(--paper-2);border:var(--w) solid var(--rule-2);
        border-radius:var(--r);font-family:var(--f-prose);font-size:var(--t-note);
        line-height:var(--lh-note);color:var(--rule)}

/* F2 a static card. the crisis resource, and the capability ladder.
      Human-written, never generated. In the product's own voice.
      Carries a way to say it was wrong. Never colour-coded, never alarming. */
.journal-app .card{margin:0 var(--gut) var(--s6);padding:var(--s6);background:var(--paper-2);
      border:var(--w) solid var(--rule);border-radius:var(--r)}
/* REVISION 48. TWO CHANGES, AND BOTH CAME OUT OF THE POLISH PASS.
   THE SELECTOR TAKES h2 AS WELL AS h3, because on /talk the permission card
   carries the FIRST heading on the page, so the outline read h1 then h3 at 1440
   and h3 with nothing above it at 390 and 834. Those cards are h2 now. Every
   other card heading in the product sits under a real .shead h2, where a
   descent to h3 is legal, so those are untouched and the selector holds both.
   THE WEIGHT IS DECLARED, which is 9.17: this computed 700 for the same reason
   .shead did. */
.journal-app .card h3,.journal-app .card h2{font-family:var(--f-label);font-size:var(--t-key);letter-spacing:.18em;
         text-transform:uppercase;font-weight:400;color:var(--rule);margin-bottom:var(--s4)}
.journal-app .card p{font-family:var(--f-prose);font-size:var(--t-note);line-height:var(--lh-note);
        color:var(--rule);max-width:38ch}
/* REVISION 16. The crisis card had one paragraph, so this never showed until
   the permission cards needed three. Two paragraphs must not run together. */
.journal-app .card p + p{margin-top:var(--s4)}
.journal-app .card-foot{display:flex;align-items:center;gap:var(--s6);margin-top:var(--s2)}

/* F3 an empty or not-enough state. one line of prose. no illustration, ever. */
.journal-app .empty{padding:var(--s8) var(--gut);font-family:var(--f-prose);font-size:var(--t-body);
       line-height:var(--lh-body);color:var(--rule);max-width:34ch}

/* F4 progress. back-transcription only. static in comps. no colour, no motion. */
/* REVISION 14. The bar is a native <progress>, not a div with a hardcoded
   width. Two reasons and the second is the real one: a fill width is DATA, and
   expressing data as an inline style was the only inline style left in Stage 3;
   and the native element carries value and max, so assistive tech announces
   "19 of 31" without an aria-label bolted on. Markup:
     <progress class="bar" value="19" max="31"></progress> */
.journal-app .progress{margin:0 var(--gut) var(--s6)}
.journal-app .progress .bar{-webkit-appearance:none;appearance:none;display:block;width:100%;
               height:var(--s5);border:var(--w) solid var(--rule);
               border-radius:var(--r);background:var(--paper-2);overflow:hidden}
.journal-app .progress .bar::-webkit-progress-bar{background:var(--paper-2)}
.journal-app .progress .bar::-webkit-progress-value{background:var(--rule)}
.journal-app .progress .bar::-moz-progress-bar{background:var(--rule)}
.journal-app .progress .cap{margin-top:var(--s3);font-size:var(--t-quiet);letter-spacing:.04em;
               color:var(--rule);font-variant-numeric:tabular-nums}


/* ---- G. OVERLAYS ----------------------------------------------------- */

/* G1 a panel. slides over, pushes a history entry, Back closes it.
      keep-this, mood edit, install, citation, crisis resource. */
.journal-app .panel{position:absolute;left:var(--rail);right:0;bottom:0;
       background:var(--paper);border-top:var(--w) solid var(--rule);
       padding:var(--s6) var(--gut) var(--s7);box-shadow:var(--elev)}
.journal-app .panel h2{font-family:var(--f-prose);font-size:var(--t-field);color:var(--rule);
          margin-bottom:var(--s5)}

/* G2 the dialog. Exactly one exists in the product: delete everything.
      If a second one appears in Stage 3, something has gone wrong. */
/* the scrim is derived from --ink, never hard-coded, so it follows a dark
   retrofit instead of being the one thing that does not. */
.journal-app .dialog{position:absolute;inset:0;display:grid;place-items:center;padding:var(--s6);
        background:color-mix(in srgb,var(--ink) 55%,transparent)}
.journal-app .dialog .sheet{margin:0;width:100%;background:var(--paper-2)}


/* ---- H. TIMELINE AND ANSWER ------------------------------------------ */

/* H1 a timeline day. the 58px column carries the date, not the time.
      An empty day is not a row. It does not exist. */
.journal-app .dayrow{display:flex;align-items:stretch}
.journal-app .dayrow .tcol{flex:0 0 var(--tcol);border-right:var(--w) solid var(--rule-2);
              padding:var(--s6) var(--s4) var(--s6) 0;text-align:right;
              font-size:var(--t-col);letter-spacing:.08em;color:var(--rule-2);
              line-height:var(--lh-tight);font-variant-numeric:tabular-nums}
.journal-app .dayrow .ccol{flex:1 1 auto;padding:var(--s5) var(--s6) var(--s6);min-width:0}
/* REVISION 7. .lede was scoped to .dayrow, but the plan page and the guest
   panel both need secondary prose outside a timeline row. Unscoped. */
.journal-app .lede{font-family:var(--f-prose);font-size:var(--t-note);
      line-height:var(--lh-note);color:var(--ink)}

/* H2 the calendar zoom. a zoom level of Timeline, never a second screen.
   Carries its own flat fill and keyline. Two reasons: the out-of-month
   numbers are --rule-2, which may not sit on the graph ground, and the
   Stage 1 comp lost them entirely against it. Padding is --s4 so that seven
   columns at 390 still clear the 44px floor: 338 - 16 - 12 = 44.3 per cell. */
.journal-app .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1);padding:var(--s4);
     margin:0 var(--gut) var(--s6);background:var(--paper-2);
     border:var(--w) solid var(--rule);border-radius:var(--r)}
.journal-app .cal .dow{font-size:var(--t-key);letter-spacing:.14em;text-transform:uppercase;
          color:var(--rule-2);text-align:center;padding-bottom:var(--s3)}
/* REVISION 3. A day with content is a link to that day; an empty day is not a
   link at all. Both render as a bare number, so the link must not underline. */
.journal-app .cal .day{aspect-ratio:1;min-height:var(--tap);display:grid;place-items:center;
          border-radius:var(--r);font-size:var(--t-print);color:var(--ink);
          font-variant-numeric:tabular-nums;text-decoration:none}
/* a day with something in it. a day without is a number and nothing else:
   no box, no dot, no dimming that reads as failure, no tap target. */
.journal-app .cal .day.has{border:var(--w) solid var(--rule);background:var(--paper-2)}
.journal-app .cal .day.has.audio{background:var(--block-2);border-color:var(--block);color:var(--ink)}
.journal-app .cal .day.out{color:var(--rule-2)}

/* H3 an excerpt. the user's own words, dated and openable. /ask/{id}.
      Always above the synthesis. Never inside it. */
.journal-app .excerpt{padding:var(--s6);border-left:2px solid var(--rule);background:var(--paper-2)}
.journal-app .excerpt p{font-family:var(--f-prose);font-size:var(--t-body);line-height:var(--lh-body);
           color:var(--ink)}
/* REVISION 43. min-width, WHICH IS REVISION 9's FIX ARRIVING AT THE ONE
   CONTROL IT MISSED. Revision 9 measured every short control at 390 and gave
   .cite, .wrong, .back and .btn.quiet a --tap minimum width; .excerpt .when
   was left because every instance of it in the product was a date, and a date
   is wide. The desktop citation column dates an excerpt by its TIME, "22:10",
   which measures 28.31 x 44 and is the first .when in the product under the
   floor. The height was never the problem and still is not.
   IT IS A COMPONENT RULE, SO IT IS NOT SCOPED TO DESKTOP. Every existing
   .when is already wider than 44, so nothing moves: verified by pixel diff on
   all 28 approved files, 0 moved. */
.journal-app .excerpt .when{display:inline-flex;align-items:center;min-height:var(--tap);
               min-width:var(--tap);
               margin-top:var(--s2);font-size:var(--t-quiet);
               letter-spacing:.04em;color:var(--rule)}


/* ==========================================================================
   3.9  MOTION. C3 GLIDE, MERGED INTO THE BASE. REVISION 49.

   MOTION IS COMPONENT BEHAVIOUR, SO IT LIVES HERE AND NOT IN A PLATFORM BLOCK.
   That is revision 38's shape rather than section 5's, and it is why the system
   lands on all five platforms from one declaration. It arrived at session 11 as
   section 7, a temporary block behind the variant class .glide; it was reviewed
   screen by screen as 39 comps in _motion/ folders; it MERGED AT REVISION 49.
   The class, the comps, the motion index and both review hatches are gone.

   THE TWO HATCHES ARE DELETED AND THAT HAS A CONSEQUENCE WORTH KNOWING.
   While this was temporary, :target and .mo could suspend the reduced-motion
   block so the work could be reviewed on a machine with Windows animation
   effects turned off. A SHIPPED PRODUCT DOES NOT OVERRULE THE READER'S OWN
   SETTING, so they are gone. On a machine reporting prefers-reduced-motion the
   screens now draw finished and still, which is correct and is what 3.13 says
   they must do. To see the motion, turn Windows animation effects on, or render
   with --force-prefers-no-reduced-motion.

   WHAT THE SYSTEM IS, IN ONE SENTENCE, BECAUSE THE CANDIDATE'S NAME IS THE
   RULE: C3 IS A SPEED LIMIT, NOT A STOPWATCH. Nothing here has a duration
   that was chosen. Every duration is its own object's distance divided by a
   speed that is fixed for that kind of object, so extending the system to a
   new screen is a measurement rather than a decision. That is what made it
   extensible at all, and it is why the four objects below carry FOUR RATES
   instead of twelve start times.

   WHAT MOVES, ANYWHERE IN THE PRODUCT. Four things, and every one of them is
   the product doing something rather than the record being disturbed:
     the date is written by hand      g-write   the hand, never printed prose
     the printed line types           g-draw    the product's own voice only,
                                                the glance and the total alike
     the waveform draws               g-draw    aria-hidden, carries no meaning
     the composer rises               g-lift    only where it hides the option
   THE RECORD NEVER MOVES AND THE HEADER NEVER ARRIVES. Every word the user
   wrote is at full opacity and unmoved at the first paint, on every screen, and
   so are the wordmark, the destinations and every printed object that is not
   one of the four above. That is direction-lock 15.3's argument satisfied by
   construction rather than by care.

   THE CONSEQUENCE, STATED BECAUSE IT LOOKS LIKE AN OMISSION AND IS NOT: MOST
   SCREENS ARE MUCH QUIETER THAN TODAY, AND ONE HAS NO LOAD MOTION AT ALL.
   Today is the only screen in the product carrying all four objects.
   10-settings-privacy carries none of them, so it loads completely still and
   its only motion is the press. That was not designed, it was measured, and it
   is the honest output of a system whose rule is that only the product's own
   acts move.

   TWO SPANS ARE LOAD BEARING AND MUST SURVIVE THE BUILD. .gline holds the
   printed line's text alone, so the typing can clip the words without clipping
   the two rules that are the row's own borders AND, which matters more, IT IS
   THE MARK THAT SAYS THIS LINE IS THE PRODUCT SPEAKING. Ask's restated question
   sits in the same slot and does not carry it, which is the only thing stopping
   the product typing the user's own words. .lblbox gives the note's two labels
   one clipped slot to roll through. Deleting either is a defect, not a tidy.
   ========================================================================== */


/* ==========================================================================
   3.7  THE MEASURED DIAGNOSIS. WHAT C3 WAS BUILT TO ANSWER. SESSION 12.

   KEPT AFTER THE SIGN-OFF, UNCHANGED, BECAUSE IT IS THE ARGUMENT UNDER EVERY

   1. NOTHING IN A5 EASES IN. --ease-out is cubic-bezier(.23,1,.32,1), whose
      velocity at t=0 is 4.35x its own average and never gets higher. It
      completes 40 PERCENT OF EVERY MOVE IN THE FIRST 10 PERCENT OF ITS
      DURATION and 68 percent in the first fifth. A move that begins at full
      speed looks like it was already running before you saw it, which is
      exactly the word the client used: sudden.

      the reveal take the final 210ms. A hard horizontal line jumps a sixth of
      the sheet, decelerates across the graph rule and every row hairline, and
      then visibly crawls over the mood row. Beating a hard edge against a
      regular 14px ruling is a strobe, and it is the most visible half of the
      complaint.

      more, and its last tick takes 160ms. Ticks sit at a 6.19px pitch, so an
      edge crossing them at a changing speed delivers them in irregular clumps.
      That is the other half of the complaint, and it is aliasing rather than
      taste.

      are travelled in the first 50ms; the remaining 0.57px is spread over the
      rest of the 160. A hundred and ten milliseconds of SUB-PIXEL translation
      under live text re-rasterises glyph edges at fractional offsets every
      frame. That is literally jitter, and it is invisible in a still.

/* THE COMPOSER TRAVELS PAST THE FOOT OF THE PAGE, SO THE PAGE HAS TO CLIP IT.
   In the product the viewport does this; in a comp the document is as long as the
   day and nothing does, so the tucked composer rendered OUTSIDE the device and
   over its own caption. Found by looking at a frozen frame, not by reading.
   overflow:CLIP rather than hidden, and the difference is load bearing: hidden
   would make .app a scroll container and take the sticky composer's scrollport
   away from it. clip does not, so the composer still sticks.
   It changes no box, which is measured rather than assumed. */
.journal-app .app{
  overflow:clip;
  --gc:cubic-bezier(.42,0,.58,1);
  --gc-rise:cubic-bezier(.25,.46,.45,.94);
  --g-date:500ms;   /* was 440, derived from Today's date. 500 is derived from
                       the WIDEST date in the product, 07-you's 225.2px at 15
                       characters. See WHAT THE EXTENSION FORCED above. */
  --g-type:820ms;   /* was 800, derived from the glance line's 47 characters.
                       THE PRINTED LINE IS NOW BOTH OBJECTS AND THE LONGEST OF
                       THEM IS THE TOTAL, at 48. Same rule as --g-date: derive
                       from the widest instance in the product, not from
                       Today's. 48 x 16.667 = 800.0ms is the floor at one
                       character a frame, so 820 clears it at 1.025 frames a
                       character where 800 would sit exactly on it. */
  --g-wave:360ms;   /* the row wave at 390 and 834. Desktop overrides it below,
                       because its widest row is 788.3px and breaks the ceiling. */
  --g-step:110ms;
  --g-comp:240ms;
  --g-hide:64px;
  --g-note:420ms;
  --g-note-lift:20px;
}

/* ONE ANIMATION, NOT TWO, AND THAT IS THE WHOLE OF THIS FIX.
   Giving each label its own transform transition meant the two had to AGREE, and
   they did not: measured on frozen transitions, the outgoing word ran 0, -1.94,
   -7.5, -15 while the incoming word sat at 0 from the first frame and never
   travelled at all. So the word did not ARRIVE, it was REVEALED, and the reader
   sees the movement finish and then the text change. Two events where there
   should be one.
   NOW A SINGLE REGISTERED PROPERTY CARRIES THE ROLL and both labels derive their
   position from it, so they are ALWAYS exactly one label height apart, by
   construction rather than by two clocks happening to match. There is one
   transition on one element. It cannot desynchronise, because there is nothing
   left to desynchronise from.
   --g-roll IS A NUMBER RATHER THAN A LENGTH so the travel stays in percentages
   of each label's own height, which is what keeps this correct at 200% type
   where the label box grows. 0 is shut, -1 is open.
   IT NEEDS @property BECAUSE AN UNREGISTERED CUSTOM PROPERTY DOES NOT
   INTERPOLATE. Both engines have it. Where it is missing the value flips between
   0 and -1 with no travel, which is the old display swap: the honest degradation
   rather than a broken one. */
/* THE LABEL JUMPED 8px ON CLOSE, AND IT WAS NOT THE ROLL. The roll animates in
   both directions in both engines, measured. What jumped was the label's
   POSITION: 7.3 says the shut note row centres its content, so with only the
   summary in the column the label sits 7.5px below the padding, and the moment
   the note opens the column fills and the label rises to sit on the padding.
   MEASURED OFF THE RENDER: the label's ink starts at y=510 shut and y=502 open.
   On opening the row grows, so the label drifts those 8px. On closing the row
   collapses at once, on the client's own instruction, so the label ARRIVES IN
   ONE FRAME. That is what reads as instantaneous, and it is not fixable by
   animating the roll, which was already animating.
   IT IS ALSO NOT FIXABLE BY ANIMATING THE COLLAPSE, because the height growth is
   interpolate-size and Chromium only, so in Gecko there is no row animation to
   hang it on in either direction. 15.11i.
   SO THE DIFFERENCE IS REMOVED RATHER THAN ANIMATED. The open state takes the
   same top offset the shut state gets from centring, so the label does not move
   between the two states at all and the only thing that happens, in both
   directions and in both engines, is the roll. It is scoped to the OPEN state
   with :has(), so the shut state, which is the one every signed render measures,
   is not touched by a single declaration.
   THE 11.5px IS MEASURED RATHER THAN CHOSEN: --s2 of padding plus half of the
   15px of slack the shut column distributes. It is written as that sum so it
   reads as the derivation it is. */
.journal-app .app .said .ccol:has(details[open]){padding-top:calc(var(--s2) + 7.5px)}
@property --g-roll{syntax:"<number>";inherits:true;initial-value:0}
.journal-app .app .said summary .lblbox{
  display:grid;overflow:clip;
  --g-roll:0;
  transition:--g-roll var(--g-note) var(--gc)}
.journal-app .app .said details[open] summary .lblbox{--g-roll:-1}
.journal-app .app .said summary .lblbox > .lbl{grid-area:1/1;display:block}
.journal-app .app .said summary .lbl.shut{transform:translateY(calc(var(--g-roll) * 100%))}
.journal-app .app .said summary .lbl.open{transform:translateY(calc((var(--g-roll) + 1) * 100%))}
.journal-app .app .said details::details-content{
  transform:translateY(var(--g-note-lift));
  overflow:clip;overflow-clip-margin:6px;
  transition:transform 0s,content-visibility 0s allow-discrete}
.journal-app .app .said details[open]::details-content{
  transform:translateY(0);
  transition:transform var(--g-note) var(--gc),
             content-visibility var(--g-note) allow-discrete}
@supports (interpolate-size:allow-keywords){
  .journal-app .app{interpolate-size:allow-keywords}
  .journal-app .app .said details::details-content{block-size:0;
    transition:block-size 0s,transform 0s,content-visibility 0s allow-discrete}
  .journal-app .app .said details[open]::details-content{block-size:auto;
    transition:block-size var(--g-note) var(--gc),
               transform var(--g-note) var(--gc),
               content-visibility var(--g-note) allow-discrete}
}
@keyframes g-draw{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes g-lift{from{transform:translateY(var(--g-hide))}to{transform:none}}
/* g-tuck IS ON translate AND NOT ON transform, so the load rise keeps transform
   to itself and the two compose rather than overwrite.
   AND ITS DISTANCE IS SCALED BY A REGISTERED NUMBER, WHICH IS WHAT MAKES
   INSTANCE 4 WORK. --g-tuckable is 1 normally and 0 while the composer is
   focused, it transitions between them, and the keyframe re-resolves its
   var() every frame, so the tuck's magnitude walks to zero and the composer
   rises. See the four instances above the rule. */
@property --g-tuckable{syntax:"<number>";inherits:false;initial-value:1}
@keyframes g-tuck{from{translate:0 0}
                  to{translate:0 calc(var(--g-hide) * var(--g-tuckable))}}
@keyframes g-write{
  from{-webkit-mask-image:linear-gradient(to right,rgb(0 0 0) 0 47.06%,rgb(0 0 0 / 0) 52.94% 100%);
       mask-image:linear-gradient(to right,rgb(0 0 0) 0 47.06%,rgb(0 0 0 / 0) 52.94% 100%);
       -webkit-mask-size:212.5% 100%;mask-size:212.5% 100%;
       -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
       -webkit-mask-position:100% 0;mask-position:100% 0}
  to  {-webkit-mask-image:linear-gradient(to right,rgb(0 0 0) 0 47.06%,rgb(0 0 0 / 0) 52.94% 100%);
       mask-image:linear-gradient(to right,rgb(0 0 0) 0 47.06%,rgb(0 0 0 / 0) 52.94% 100%);
       -webkit-mask-size:212.5% 100%;mask-size:212.5% 100%;
       -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
       -webkit-mask-position:0% 0;mask-position:0% 0}
}
.journal-app .app .keybox .v:not(.printed){
  animation:g-write var(--g-date) var(--gc) backwards}
.journal-app .app .wave{
  animation:g-draw var(--g-wave) var(--gc) var(--g-step) backwards}
/* THE PRINTED LINE TYPES, AND IT IS BOTH OBJECTS RATHER THAN ONE.
   CLIENT INSTRUCTION AT SESSION 14: everything between the two rules in the
   header types, D3's total included. Section 13.12 already established that
   .glance and .total are THE SAME SLOT, the printed line under the
   destinations, .glance on Today and .total on Timeline, so giving one a
   behaviour the other does not have was the inconsistency rather than the fix.
   BOTH NEED .gline FOR THE SAME REASON. Each carries its two rules as its own
   borders, so clipping the element sweeps the RULING in with the words and
   reads as a progress bar being drawn. The span holds the text alone.
   ONE RATE, ONE DURATION, ONE STEP COUNT, derived from the LONGEST printed
   line in the product rather than from Today's:
     the glance         47 characters   Sleep has come up on four of the...
     the total          48 characters   148 entries, 31 recordings, 4h 12m...
     the day seven total 44 characters  3 entries, 1 recording, 5m 08s...
   steps(48) over a 47 or 44 character line reveals in FINER steps than one
   character, which is inside the ceiling rather than outside it. A coarser
   count would clump, which is cause 3.
   THE DELAY IS CONDITIONAL, AND THE CONDITION IS THE RULE'S OWN REASON.
   15.11e runs the two written objects in sequence because they are THE TWO
   PENS ON THAT SCREEN and running them together is cause 6. On Timeline at 390
   and 834 there is no date box at all, so there is no second pen and nothing to
   wait for: the line starts at 0. Where a hand-written date IS present, the
   line waits for it. Scoped with :has() on .app so each device in a states pack
   is judged on its own contents. A RULE WHOSE REASON IS ABSENT IS NOT A RULE.
   WHAT THIS DOES NOT DO. It does not touch the total's own content rules. D3
   still says the number is never coloured, never badged and never counted down,
   and 8.1 still says it only rises. A sweep that reveals it left to right in
   the order it is read is the same gesture the glance already has. THAT IS THE
   CLAUSE TO LOOK AT WHEN JUDGING THIS, and it is the client's to confirm:
   a number that assembles itself in front of the reader is closer to being
   styled as an event than a number that is simply printed. */
.journal-app .app .glance .gline,.journal-app .app .total .gline{
  animation:g-draw var(--g-type) steps(48,start) 0ms backwards}
.journal-app .app:has(.keybox .v:not(.printed)) .glance .gline,.journal-app .app:has(.keybox .v:not(.printed)) .total .gline{
  animation-delay:var(--g-date)}
/* THE COMPOSER MOVES ON FOUR OCCASIONS AND ON NO OTHERS. CLIENT INSTRUCTION AT
   SESSION 14, and it is written out here because "only these four" is the rule
   rather than a description of what happens to fall out.
     1  THE APP OPENS. It rises 64px, once, over --g-comp. g-lift.
     2  THE JOURNAL IS SCROLLED UP, meaning the reader is moving further into
        the day. It goes DOWN by the same 64px until the out-of-memory option
        is hidden and the field and the record control are all that is left.
     3  THE JOURNAL IS SCROLLED BACK DOWN. It comes UP again. 2 and 3 are one
        mechanism rather than two: a scroll timeline has no direction of its
        own, so going back up the document runs the same move backwards at
        exactly the speed of the thumb.
     4  IT IS INTERACTED WITH WHILE DOWN. It comes up, so the option is
        reachable the moment there is something to keep out of memory.
   AND NOWHERE ELSE. Interacting with it while it is already up does nothing at
   all, which is what 4 is scoped to make true: the rise is not a response to
   being touched, it is a response to being touched WHILE HIDDEN.

   INSTANCE 4 SCALES THE TUCK RATHER THAN CANCELLING IT, AND THE FIRST
   MECHANISM WAS BUILT, MEASURED AND THROWN AWAY.
   An animation outranks a declaration, so a :focus-within rule setting the
   composer back to 0 cannot win against a running scroll animation. THE
   OBVIOUS ANSWER IS TO DROP g-tuck FROM THE LIST ON FOCUS and let the value
   fall back to its declared one with a transition to carry it. It was built.
   IT DOES NOT ANIMATE: MEASURED IN AN ISOLATED CALIBRATION PAGE with a
   negative transition-delay, an element whose animation is removed jumps
   straight to the declared value at every sampled percentage, 0px at -10ms,
   at -120ms and at 0s alike. A TRANSITION DOES NOT FIRE WHEN AN ANIMATION IS
   REMOVED. It also had a second fault: on blur the animation re-applies and
   wins outright, so the composer would have snapped back down.
   WHAT WORKS IS SCALING THE ANIMATION'S OWN DISTANCE. --g-tuckable is a
   registered number, 1 at rest and 0 while the composer holds focus, and
   g-tuck's end value is `--g-hide * --g-tuckable`. The keyframe re-resolves
   its var() as the number transitions, so the tuck's magnitude walks to zero
   and the composer rises. Calibrated the same way: 200, 164, 59, 0 across the
   sampled percentages, which is a value walking rather than a value jumping.
   THREE THINGS FALL OUT OF IT, AND ALL THREE ARE THE INSTRUCTION.
     Focus while tucked rises, over --g-comp.
     BLUR TUCKS BACK, over the same --g-comp, because the number transitions
     both ways. The first mechanism could not do this at all.
     FOCUS WHILE ALREADY UP DOES NOTHING, and that is the part the instruction
     is really about. Below 24px of scroll g-tuck is out of range and does not
     apply, so its end value is not being used and changing the number it is
     scaled by has no effect on anything. The composer cannot twitch when it is
     already where it belongs. */
.journal-app .app .composer:has(.opt){
  --g-tuckable:1;
  animation:g-lift var(--g-comp) var(--gc-rise) backwards;
  transition:--g-tuckable var(--g-comp) var(--gc-rise)}
.journal-app .app .composer:has(.opt):focus-within{--g-tuckable:0}

/* THE COMPOSER DOES NOT ENTER TWICE ON ONE SCREEN, AND THE SCOPE IS ONE SCREEN
   RATHER THAN THE WHOLE WALK.
   CLIENT REPORT: tapping the input box replays its entrance. It does. In a
   prototype the composer's field is a LINK, <a href="#f-typing">, so tapping it
   NAVIGATES; the destination goes from display:none to display:flex, and an
   element going from none to block STARTS ITS ANIMATIONS. The composer of the
   screen you land on therefore rises from below again.
   THE FIRST FIX WAS TOO BLUNT AND IS RECORDED BECAUSE IT WAS WRONG. It dropped
   the rise across the entire walk, which stopped the replay and also removed
   INSTANCE 1 from the prototype altogether. The client needs it there, and they
   are right: the opening rise is the one instance that is about the app opening,
   and a walk is where you open the app.
   THE REAL SCOPE IS THE SCREEN YOU ARRIVE AT BY TOUCHING THE COMPOSER, because
   that is THE SAME SCREEN ONE STATE LATER. Today with something typed into it is
   not a new screen, so its composer is already in place and must not enter. Every
   other arrival in the walk is a real arrival and still rises.
   .restate IS DERIVED FROM THE MARKUP RATHER THAN NAMED. The generator collects
   the target of every link that IS THE COMPOSER, which is the field and the
   commit control: the field takes you INTO the typing state and Save takes you
   back OUT of it, and both ends of that round trip are the same screen one
   state later. THE MIC IS DELIBERATELY NOT IN THAT LIST, because it leads to
   /talk, which is a real change of screen and has no composer at all. Search
   rows are excluded because a search field is a different object, and self
   links because they change no hash and restart nothing. On all three platforms
   it resolves to f-today and f-typing. It is not the prototype's own .screen
   class: keying a rule in this file on presentation furniture defined in
   another file's style block is the coupling this project keeps catching.
   AND THE RISE SURVIVES WHERE IT MEANS SOMETHING, WHICH IS WHY THIS SCOPE IS
   THE RIGHT ONE RATHER THAN A COMPROMISE. f-today is NOT AN INDEX CHIP: the
   walk's entry points are first run, timeline, return, transcribing, Pro today
   and ask, so Today is only ever reached by navigating inside an app that is
   already open. THE APP OPENS AT FIRST RUN, which is the first chip on the
   index and is the one composer screen that keeps its entrance. So instance 1
   is demonstrated exactly where the app actually opens, and nowhere that it
   would be a replay.
   WHAT IS STILL TRUE AND IS REPORTED RATHER THAN GUESSED AT. The date, the
   printed line and the waveform DO still re-run on those transitions, because
   CSS cannot tell a second state of one screen from a real change of screen.
   Only the composer is treated as continuous, because only the composer was
   reported. Extending it to the other three is one more selector and is the
   client's call. */
/* .restate IS PROTOTYPE FURNITURE AND A BUILD HAS NO USE FOR THE CLASS ITSELF.
   It exists because a no-script prototype navigates with :target and reveals a
   screen with display, and AN ELEMENT GOING FROM display:none TO display:block
   STARTS ITS ANIMATIONS. So the screen you reach by touching the composer, and
   the one you reach by pressing Save, would replay Today's entrance.
   THE RULE IT ENCODES IS REAL AND THE BUILD MUST HONOUR IT: a second state of
   one screen is not an arrival, so the composer must not re-enter. That is a
   build obligation and it is written up in direction-lock 7.4. */
.journal-app .app.restate .composer:has(.opt){animation-name:none}
@supports (animation-timeline:scroll()){
  .journal-app .app .composer:has(.opt){
    animation-name:g-lift,g-tuck;
    animation-duration:var(--g-comp),auto;
    animation-timing-function:var(--gc-rise),linear;
    /* Keep the option tucked beyond 120px; forwards does not apply before 24px,
       so the initial rise remains unopposed. Motion integration, September 2026. */
    animation-fill-mode:backwards,forwards;
    animation-timeline:auto,scroll();
    animation-range:normal,24px 120px}
  /* the typing state keeps the scroll tuck and loses only the entrance, so
     instances 2, 3 and 4 all still work there. The list is index matched, so
     position 0 is none and position 1 is still g-tuck on its scroll timeline. */
  .journal-app .app.restate .composer:has(.opt){animation-name:none,g-tuck}
}



/* ---- 3.13  REDUCED MOTION. Removed entirely, not shortened. -------------
   direction-lock 7.7 says REMOVE the motion rather than
   soften it, which is stricter than the usual advice to keep gentle fades. The
   lock wins, so the screen collapses to its finished state with no fade at all.
   THE PRESSED STATE IS DELIBERATELY LEFT IN, on 2.2b's own recorded reasoning:
   a press is a STATE rather than a transition, so with the transition gone it
   simply becomes instant, which is the right outcome for a reader who asked for
   no motion but still needs to know they hit the control.
   EVERY SELECTOR HERE MIRRORS ONE IN 3.10. The two review hatches that used to
   raise these selectors, :not(:target) and :not(.mo), are gone with the merge,
   so this block wins on source order alone. This file still carries no
   !important anywhere in it.
   THE LABEL'S RESTING OFFSET IS NOT MIRRORED HERE, ON PURPOSE. 3.10 gives the
   OPEN note the same top offset the shut one gets from centring, so the label
   does not change position between the two states. That is a removed
   difference rather than a motion, and removing it is still right when the
   reader has asked for no motion: without it the label would jump 8px in one
   frame, which is exactly what reduced motion is meant to spare them.
   THE HATCHES ARE GONE, WHICH IS THE MERGE DOING WHAT IT SAID IT WOULD. A
   shipped product does not overrule the reader's own setting. On a machine with
   Windows animation effects turned off, every screen in this product draws
   finished and still, and that is the design working rather than failing. */
@media (prefers-reduced-motion:reduce){

  .journal-app .app:not(:where(html[data-motion-review="play"] *)) .dest a,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .chips button,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .play,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .mic,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .send,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .btn,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .cite,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .wrong,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .opt,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .said summary,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .said .chev,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .said summary .lblbox,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .composer:has(.opt){transition:none}

  .journal-app .app:not(:where(html[data-motion-review="play"] *)) .said details::details-content,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .said details[open]::details-content{
    block-size:auto;transform:none;overflow:visible;transition:none}

  .journal-app .app:not(:where(html[data-motion-review="play"] *)) .keybox .v:not(.printed),.journal-app .app:not(:where(html[data-motion-review="play"] *)) .glance .gline,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .total .gline,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .wave,.journal-app .app:not(:where(html[data-motion-review="play"] *)) .composer:has(.opt){animation:none}
}


/* ==========================================================================
   4. TABLET WEB, 834. STAGE 4.
   The reflow, and nothing else. No new colour, no new component, no new
   content. Everything below moves things; nothing below invents anything.

   WHY THIS IS A CONTAINER QUERY AND NOT A MEDIA QUERY
   A media query compares the WINDOW. Every Stage 3 comp is a 390px .device
   inside a window that is whatever the reader happened to open, so a media
   query would restyle the mobile comps into tablet layout the moment anyone
   opened one maximised, and journal-prototype.html is a file that gets sent
   to people. A container query compares .app, which is 390 in a mobile comp
   and 834 in a tablet one no matter how wide the window is. It is also the
   more honest description of the rule: this layout depends on how wide the
   APP is, which in production is the viewport and in a comp is the device.
   Pure CSS either way. No script.

   THE ARGUMENT FOR THE LAYOUT
   834 does not want a second pane. The only place the flow argues for one is
   00-flow.md section 3.5, where a citation opens its source and Back returns
   to the answer, and the brief assigns that depth to DESKTOP. Timeline's two
   zooms are one screen behind a segmented control, so showing both would
