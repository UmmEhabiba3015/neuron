   delete the control; a Timeline permanently beside Today would make the word
   destination meaningless and break the Back rules in section 2. And 834
   split down the middle is two phones side by side.

   834 does not want a full-width single column either, and this one is
   measurable rather than aesthetic: the user's words would run to about 80
   characters, which is past readable, on the highest-status content in the
   product.

   So the tablet is the first platform where the WHOLE PAGE FITS ON THE
   SCREEN. At 390 the graph bleeds off every edge and you are looking at part
   of a page. At 834 the page has a width, a binding down its left, a right
   edge, and the generous cream margins rule 6 has asked for since Stage 1.
   The page is EXACTLY 40 GRAPH MODULES so its ruling lands on its own edge
   instead of being cut mid-square.
   ========================================================================== */

/* .app is the container. Nothing below styles .app itself, because an element
   cannot query itself; everything below is a descendant of it. */
.journal-app .app{container-type:inline-size}

@container (min-width:700px){

  /* THE PAGE IS AN OBJECT NOW. It has a width, and outside it is .app, which
     is --paper: the page role, unruled. The graph stopping IS the page edge.
     It runs the full height rather than floating with a top and bottom
     margin, because a page longer than the window is what a notebook is, and
     because the composer is sticky to the foot and a bottom margin under a
     sticky control reads as a mistake. */
  .journal-app .page{
    --gut:var(--s8);                 /* the paper margin doubles. the module does not. */
    width:100%;                      /* NOT OPTIONAL, AND IT COST A MEASURING PASS.
                                        .page is a flex item and was relying on stretch
                                        to fill .app. An auto margin in the cross axis
                                        CANCELS stretch, so margin-inline:auto silently
                                        turned the page into a shrink-to-fit box. Today
                                        holds content wider than 560 so it landed on the
                                        cap and looked right. A sparse screen does not:
                                        the /talk stack measured a 430px page and the
                                        rail, whose left is calculated from --page-w,
                                        stranded 65px away from the paper it binds.
                                        width:100% restores the fill; max-width caps it. */
    max-width:var(--page-w);
    margin-inline:auto;
    min-height:1120px;               /* 834x1194 less about 60 of browser furniture,
                                        the same reasoning as .app's 764 at 390. */
  }

  /* The binding stays welded to the page. It is absolutely positioned in .app,
     so centring the page would otherwise leave the spiral stranded 125px away
     from the paper it is supposed to bind. 100% here is .app's padding box,
     which is the full 834. */
  .journal-app .rail{left:calc((100% - var(--rail) - var(--page-w))/2)}

  /* THE MASTHEAD IS ONE ROW, NOT TWO. The wordmark and the second-row object
     have room to sit side by side, which buys back 44px of vertical space in a
     browser that has already taken its own. Rule 7.6 still holds and holds by
     construction: all three second-row objects are min-height --ctl and the
     row centres on the tallest, so the destination row sits at 80px from the
     top of the app on Today, Timeline, Ask and You alike. Measured, not
     assumed. */
  .journal-app .mast{display:flex;align-items:center;justify-content:space-between;gap:var(--s7)}
  .journal-app .wordmark{margin-bottom:0}
  .journal-app .mast > .keybox,.journal-app .mast > .seg{flex:0 0 auto}
  /* REVISION 27 removed the only masthead .crow in the product: Ask now carries
     the same date box as Today and You. The base rule that pins a masthead
     .crow to --ctl stays as a guard; the 360 cap that used to sit here is gone
     with the object it constrained. */

  /* Destinations take their own width instead of dividing the page. Four items
     stretched across 504px would be 126px of box around an 11px word. */
  .journal-app .dest a{flex:0 0 auto;padding:0 var(--s7)}

  /* REVISION 21. A PUSHED PAGE KEEPS ITS BACK CONTROL ON ITS OWN LINE.
     .mast is a flex row here, and a pushed page puts three things in it: back,
     wordmark, and the second-row object. Left alone, space-between would strand
     the wordmark between the back control and the date, which is neither the
     mobile arrangement nor a sensible one. flex-basis 100% forces the break, so
     back holds line one and the wordmark and the date share line two exactly as
     they do on a destination. Row gap is 0, which is what the block layout at
     390 gives; only the columns get the --s7. */
  .journal-app .mast{column-gap:var(--s7);row-gap:0;flex-wrap:wrap}
  .journal-app .mast > .back{flex:0 0 100%}

  /* REVISION 22. THE PANEL FOLLOWS THE PAGE, NOT THE VIEWPORT.
     .panel is absolutely positioned and its containing block is .app, because
     .page is not positioned. At 390 that is invisible: left:--rail and right:0
     land exactly on the page. At 834 it would span the full 834 and float over
     the cream margins, which is the same stranding bug the rail had. */
  .journal-app .panel{left:calc(var(--rail) + (100% - var(--rail) - var(--page-w))/2);
         right:calc((100% - var(--rail) - var(--page-w))/2)}

  /* REVISION 23. .app.clip has to keep working, and the page's min-height was
     quietly defeating it. clip exists so the states pack can show ten states of
     one screen without ten full viewports; the height now lives on .page, so
     that is where it has to be released. Presentation only, as before: no
     shipped screen uses it. */
  .journal-app .app.clip .page{min-height:0}

  /* REVISION 25. THE SUBORDINATE PROSE CAPS ARE RELEASED, AND THIS IS A BUG
     FIX RATHER THAN A PREFERENCE.

     direction-lock.md 3.2 states the rule as a CEILING: subordinate content
     "does not get to run wider than the writing above it." The 32ch and 38ch
     and 34ch values are a PROXY for that ceiling, and the proxy was measured
     at 390 where it sat almost exactly on it:

                            the note   the writing   note as % of ceiling
       390, approved base    241.3px      250px            96%
       834, as first built   241.3px      416px            58%

     At 390 the cap is very nearly a no-op and reads as a safety rail. At 834
     it stops being a rail and becomes a hard constraint doing something it was
     never tested for: the note ends less than three fifths of the way across a
     row whose fill and rules run the whole width, so the text stops short
     inside a visible box. That reads as a fault, not as a measure, and it is
     an information-hierarchy CHANGE between platforms, which the engagement
     rules forbid outright.

     Releasing the caps is safe on the only ground that matters here, which is
     the measure itself. At 834 the released widths come to about 55ch for the
     note, 57ch for an empty state and 63ch for card copy, all inside the
     comfortable 45 to 75 band. Nothing runs wider than the user's words,
     because every one of these sits in the same column the user's words sit
     in, so the ceiling still holds and now holds for the reason it was written
     rather than by coincidence.

     The hierarchy does not depend on this and never did. The note is still
     14px against 16.5px, still --rule against --ink, still inside a labelled
     row with its own printed key, and still shut until asked for. Four
     signals, unchanged, and exactly the four that carry it at 390 where the
     note and the writing are already the same width to within nine pixels. */
  .journal-app .said p,.journal-app .card p,.journal-app .empty,.journal-app .srowlink .why{max-width:none}

  /* REVISION 26. THE ONE EXCEPTION TO 25, AND IT IS NOT A MEASURE RULE.
     Every .card in the product is a block that fills its container, except the
     one inside .dialog, which is a grid item sized to its own content. Released
     along with the rest, its paragraph set on a single 706px line and the card
     grew past the page's own edges. The bound here is FUNCTIONAL rather than
     typographic: a confirmation must stay compact so that Export instead and
     Delete everything stay near each other, on the one irreversible screen in
     the product where a long throw between the safe button and the destructive
     one is exactly the arrangement that produces a mis-tap.
     Restored to the mobile value, so the dialog measures the same at both
     widths. */
  .journal-app .dialog .card p{max-width:38ch}

  /* REVISION 32. THE SETTINGS VALUE STOPS BEING SHRUNK ONCE THERE IS ROOM.
     .srowlink is a flex row of a label and a value, and both were allowed to
     shrink. At 390 that is correct: the row is 310px of content and there
     genuinely is not room for both, so the value wraps and that is the honest
     outcome. At 834 the row is 476 and the label's text only reaches about 424
     of it, but revision 25 released .srowlink .why, which raised the label's
     flex base to its full max-content and let it claim the slack anyway. The
     value was squeezed to 32px and set "Read it" as "Read / it" on a row with
     50px going spare, which reads as broken rather than as tight.
     flex:0 0 auto lets the value take its own width and leaves the label to
     absorb the wrapping, which is what the label is for. Layout and reflow
     only, so it stays inside this block and 390 is untouched. */
  .journal-app .srowlink .val{flex:0 0 auto}

  /* REVISION 24. The dialog centres on the PAGE, not on the app.
     Its scrim covers everything, which is right for a modal, but it was
     centring its card on .app's padding box and landing 12px left of the
     page's axis. Invisible at 390, where the two are the same line. The rail's
     width added back as left padding puts the card on the page's centre, which
     is where every other overlay now sits. */
  .journal-app .dialog{padding-left:calc(var(--s6) + var(--rail))}
}


/* ==========================================================================
   5. DESKTOP WEB, 1440. STAGE 4, SECOND HALF.
   REVISION 34.

   THIS BLOCK IS ONE DECLARATION, AND THAT IS THE FINDING RATHER THAN A GAP.
   Every other value the desktop needs is already correct in section 4, because
   THE PAGE DOES NOT CHANGE AT 1440. The full argument is direction-lock.md
   section 13; the short version is below, because a reader of this file should
   not have to take the one-line block on trust.

   WHY THE PAGE DOES NOT GET WIDER, RE-DERIVED RATHER THAN INHERITED
   --page-w is a proxy for a reading measure, and the measure is the rule. The
   proxy was checked at 1440 instead of being carried:

     page 560   the writing runs 416px    54 characters on its first line
     page 700   the writing runs 528px    74 characters on its first line

   54 is the middle of the readable band. 74 is past it, on the highest-status
   content in the product. So 560 holds, and it holds for a measured reason.

   NOTE THAT ch DISAGREES, AND ch IS THE ONE THAT IS WRONG.
   In this product's own unit those two are 46.8ch and 59.4ch, and BOTH sit
   inside the 45 to 75 band section 3.2 quotes. Measured here: Constantia at
   16.5px gives 1ch = 8.887px, against a real average character of 6.821px.
   ch overstates this face's measure by a factor of 1.303. Every ch figure in
   this project is 30% optimistic, which is why a page that ch calls comfortable
   reads as too wide. Characters per line is the instrument. See section 13.

   WHY --gut IS NOT SCALED, WHICH IS THE TRAP IN THIS BLOCK
   The gutter went 14 at mobile, 28 at tablet. The obvious next step is 42, and
   it is wrong. The gutter is INSIDE the page, and the page is not getting
   wider, so raising the gutter takes the width straight out of the sheet: the
   writing would fall to 388px and 50 characters, NARROWER than tablet. That is
   an information-hierarchy change between platforms, which the engagement rules
   forbid. --gut stays at --s8. A series is not a rule.

   WHAT 1440 ACTUALLY CHANGES, AND IT IS NOT THE PAGE
   The margin. At 390 there is none. At 834 it is 125px and can only be a
   margin. At 1440 it is 428px each side, which is wide enough to hold a sheet,
   and that is where 00-flow.md section 3.5 lands: a citation opens its source
   BESIDE the page instead of over it, and the page does not move, which is the
   whole reason the flow asks for it. That object is specified in section 13
   and is built by the screen that first needs it, which is Ask. It is
   deliberately not declared here in advance of a deliverable that renders it.

   THE HEIGHT IS THE ONE THING THAT GENUINELY MOVES, AND IT MOVES DOWNWARDS.
   Desktop is the first platform whose window is SHORTER than the one before
   it. Tablet portrait is 1194 less 74 of browser furniture; a 1440 desktop
   window is 900 less about 116 of tab strip, toolbar and bookmarks bar. The
   page loses 336px of height and gains none. 784 is 56 graph modules, the same
   whole-module reasoning as the tablet's 1120, which is 80.

   REVISION 35. THE SHELL IS SIGNED OFF AND MERGES IN. V5 FIELD, WITH FIVE
   FIXES. Everything below the height was section 5d, behind a temporary .f
   class, from the moment it was drawn until the client approved it. The class
   is gone, the selectors are plain, and sections 5b, 5c, 5e and 5f are deleted
   from this file along with the ten selection comps and the two review
   variants that depended on them. The argument is direction-lock.md 13.11.

   WHAT THE SHELL IS. No page card. The graph bleeds to the right edge of the
   window, the binding sits at the far left where a notebook on a desk sits,
   and the masthead, destinations, date and glance line become a TITLE BLOCK
   down the left. Chrome takes the horizontal so the record gets the whole of
   the scarce vertical. No tab bar, no row of boxes, no chrome above content.

   THREE THINGS CAME IN WITH THE MERGE AND NONE OF THEM IS THE SHELL.

   1. FIX 3 WAS IN THE WRONG SECTION AND WOULD HAVE BEEN DELETED BY THE
      SIGN-OFF ITSELF. The composer centring lived at the bottom of section 5f,
      the impeccable review block, scoped .app.f rather than .app.f.ia, so it
      was styling the signed copy from inside a block whose stated exit
      condition is deletion. It rendered correctly the whole time and would
      have vanished the moment 5f went, taking the composer off the sheet's
      axis on every desktop screen. Found by reading the exit condition against
      the selectors rather than by looking at the screen, which could not have
      shown it.

   2. THE white-space:nowrap ON THE DATE IS GONE, AND THAT IS THE 200% FIX.
      It was added to stop the date wrapping in V5's 300px title block. The
      block is 360 now and the date needs 251.5, so the nowrap bought nothing
      at rest and CLIPPED THE DATE MID GLYPH at 200% type: measured on the
      signed copy at 1440, keybox clientW 288 against scrollW 451, reading
      "Sun 9 Au". direction-lock.md 3.3 is binding and .keybox is min-height,
      so wrapping is exactly what it was built to do. THE INSTRUMENT WAS
      WRONG, NOT THE INTENT: the wrap was a symptom of a box that was too
      narrow, and widening the box fixed it. The nowrap should have come out
      when the width went in.

   3. TWO OF THE FOUR CROSS-PLATFORM DEFECTS ARE FIXED HERE, DESKTOP ONLY, BY
      CLIENT DECISION. direction-lock 6, revision 48, lists four defects that exist identically
      at 390, 834 and 1440. The client chose to fix them as desktop is built
      and to leave the two signed-off platforms byte-identical. That is a
      deliberate exception to the rule that information hierarchy and
      semantics are held identical across all five platforms, and it is
      recorded as their decision rather than assumed.
      THE VISIBLE CONSEQUENCE, STATED SO IT IS NOT DISCOVERED LATER: the mood
      question renders at weight 400 here and at 700 at 390 and 834, so the
      one hand-set object in the product is two different objects across the
      three web platforms until 9.14 is closed everywhere.
      The other two of the four are markup and live in the desktop files: the
      aria-pressed on six toggles, and the wordmark becoming the h1.
      The fourth, the collapsed note row's centring, was already here.
   ========================================================================== */

@container (min-width:1200px){
  /* THE DESKTOP WAVE IS THE ONE DURATION THAT HAD TO BE RE-DERIVED PER PLATFORM,
     AND IT IS THE SPEED LIMIT DOING ITS JOB.
     The row wave is 154.3px at 390 and 320.3 at 834, and 360ms holds both a long
     way inside the ceiling. AT 1440 TODAY'S ROW IS 788.3px, which is 5.1 times the
     mobile row on the same 360ms, and that breaks 15.11b's stated 45px a frame:
       peak = 1.724 x 788.3 / (360 / 16.667) = 63.4 px a frame.  OVER.
     Derived instead of nudged:
       D >= peak x width x 16.667 / 45  =  1.724 x 788.3 x 16.667 / 45  =  503.4ms
     520ms, which puts the widest desktop row at 43.6 px a frame and the /talk
     capture wave, .wave.big at 588px, at 32.5. Both inside 45.
     WHY THIS IS A DESCENDANT RULE AND NOT A TOKEN ON .app. Sections 4 and 5
     are container queries keyed on .app, and AN ELEMENT CANNOT QUERY ITSELF, so a
     redeclaration of --g-wave on .app inside @container would never apply. 12.6
     and 13.6 both state that constraint and this is the first time motion has
     met it. The duration therefore lands on .wave, which is a descendant, and the
     token above stays the base value.
     THE TICK PITCH IS WHY ONE CEILING COVERS EVERY PLATFORM. 12.7 holds tick
     weight at 1.769 and pitch at 6.18 to 6.21px on every row on every platform by
     re-authoring viewBoxes, so a limit written in pixels a frame is also a limit
     in ticks a frame, and cause 3 is answered at all three widths by one number.
     Measured pitch across the product this session: 6.1814 to 6.2075. */
  /* .app .wave RATHER THAN .wave, AND THAT IS SPECIFICITY RATHER THAN STYLE.
     The rule it has to beat is `.app .wave{animation:...}` in 3.10, which is
     (0,2,0) and sets animation-duration through the shorthand. A bare `.wave`
     here is (0,1,0) and LOSES on specificity no matter how late it sits, so the
     desktop row went on running at 360ms and breaking the 45px a frame ceiling.
     Measured at the merge: computed animationDuration was 0.36s at 1440 until
     the class was added back. While this lived behind .glide both selectors
     carried the variant class and the tie was settled by source order; dropping
     the class at revision 49 dropped it from BOTH sides and broke the tie the
     wrong way. A MERGE THAT REMOVES A CLASS REMOVES IT FROM THE OVERRIDE TOO. */
  .journal-app .app .wave{animation-duration:520ms}


  .journal-app .page{min-height:784px}

  /* ---- the shell ------------------------------------------------------- */
  .journal-app .rail{left:360px}
  .journal-app .page{max-width:none;width:auto;margin-left:360px;margin-right:0;
        --gut:var(--s9)}
  /* REVISION 45. THE SECOND-ROW SLOT IS SIZED TO THE WIDEST DATE BOX IN THE
     PRODUCT, NOT TO TODAY'S, AND THE FOURTH DESTINATION IS WHAT FOUND IT.
     Rule 7.6 says nothing above the destination row may vary. It was measured
     on Today and Timeline at session 6 and held. YOU BREAKS IT: its date box
     is keyed "Keeping" against Today's "Day" and valued "Since March '26"
     against "Sun 9 Aug '26", so it needs 298.33px of a 290px column, wraps to
     two lines, stands 77 tall against 50, and pushes the destination row from
     138 to 165. Switching to You moved the whole title block by 27px.
     THIS IS 13.10's DEFECT 1 AT A DIFFERENT SCALE AND IT IS THE SAME MISTAKE:
     a box sized to the date it happened to contain rather than to the widest
     one it has to hold. There the fix was 336px for a 251.5px need; here the
     need is 298.33 and the right padding goes --s8 to --s5, which takes the
     column to 308 and leaves 9.67px of slack.
     WHY THE PADDING RATHER THAN THE WIDTH: the block is 360 because the rail
     and the page are welded to it, so widening it moves the binding, the page,
     the sheet, every waveform row and both split columns for 8px of date. The
     left padding stays --s9, because that is the page gutter arriving at the
     window's edge; the right one is only the gap to the binding.
     IT MOVES THE TWO APPROVED DESKTOP SCREENS, deliberately: the destinations
     and the printed line under them are 18px wider on 01-today and
     02-timeline. Stated here and in PROJECT.md rather than found in a diff.
     WHAT WAS NOT DONE: nothing was scoped to You, and no component's internal
     padding was tightened at this platform only. Both would have made one date
     box a different object from the other three. */
  .journal-app .title{position:absolute;left:0;top:0;bottom:0;width:360px;
         padding:var(--s7) var(--s5) var(--s7) var(--s9)}
  .journal-app .title .wordmark{margin-bottom:var(--s6)}
  .journal-app .title .dest{flex-direction:column;gap:var(--s3);padding:0 0 var(--s7)}
  .journal-app .title .dest a{flex:0 0 auto;justify-content:flex-start;padding:0 var(--s6)}
  .journal-app .title .dest a:last-child{margin-left:0;margin-top:var(--s7)}

  /* REVISION 36. THE TITLE BLOCK TAKES TIMELINE'S TWO OBJECTS. Found building
     desktop screen 2, which is the first screen that is not Today, and none of
     it is a new component.
     The title block has two slots under the wordmark: the SECOND-ROW OBJECT,
     which is a .keybox on Today, You, Ask and first run and a .seg on
     Timeline, and the PRINTED LINE beneath the destinations, which is .glance
     on Today and .total on Timeline. Both slots were written for Today's
     occupant only, so Timeline's arrived with no bottom margin and with the
     page gutter still on it.
     RULE 7.6 IS WHY THE FIRST OF THESE MATTERS RATHER THAN BEING TIDINESS.
     At 390 and 834 the rule is that the destination row sits at the same
     height on all four destinations. Here the masthead is the title block, so
     the rule becomes a claim about it, and the claim only holds if both
     second-row objects are --ctl tall AND carry the same space beneath them.
     .keybox and .seg are both min-height --ctl already; the margin was the
     half that was missing. STILL TO BE MEASURED on all four destinations once
     Ask and You exist, because it cannot be measured from two screens either. */
  .journal-app .title .keybox,.journal-app .title .seg{margin-bottom:var(--s7)}
  .journal-app .title .glance,.journal-app .title .total{margin:0}

  /* The zoom control fills the column, exactly as the destinations under it
     do. .seg is inline-flex in the base, which is right in a masthead row
     where it sits beside a wordmark and takes its own width, and wrong in a
     column of full-width objects where it would be the one object that does
     not reach the block's right edge. This is the same change the shell
     already makes to .dest a, and it is layout rather than identity. */
  .journal-app .title .seg{display:flex}
  .journal-app .title .seg button{flex:1 1 0;justify-content:center}

  /* REVISION 44. THE PANEL FOLLOWS THE PAGE, AND THIS IS THE THIRD PLATFORM
     TO NEED THAT SENTENCE WRITTEN OUT.
     .panel is absolutely positioned and its containing block is .app, because
     .page is not positioned. At 390 left:--rail and right:0 land exactly on
     the page and the bug does not exist. At 834 revision 22 had to give it the
     tablet's own centring arithmetic. That arithmetic is written in terms of
     --page-w, which is still 560 here and no longer describes anything: it
     computes left 452 and right 428 for a page that runs 384 to 1440, so the
     guest panel sat 68px inside the page's left edge and stopped 428px short
     of its right. Found by building the states pack, which is the only screen
     that renders a panel, exactly as it was at tablet.
     PROJECT.md's standing lesson is "treat anything positioned against .app as
     suspect at every new platform". Revisions 22, 23 and 24 were the tablet's
     three; this is desktop's, and it is the same object. */
  .journal-app .panel{left:calc(360px + var(--rail));right:0}

  /* ---- 1. the first entry starts on the date's line -------------------- */
  /* Derived from the three objects above the date box rather than typed, so
     it follows if any of them ever move: --s7 of title padding, the wordmark
     at --t-mast on a flat line height, and the --s6 beneath it. 68px today.
     Probed: date box top 68.0, sheet top 68.0. The first entry's ruled row
     starts at 69.0, one pixel lower, because the sheet draws its own hairline
     above it. The alignment is edge to edge and that is the right comparison.

     REVISION 39. THE LEAD BECOMES A TOKEN, BECAUSE A PUSHED PAGE PUTS A BACK
     CONTROL ABOVE THE THING THE PAGE IS ALIGNED TO.
     Found building the ten remaining desktop screens, and it is fix 1 holding
     rather than fix 1 changing. Seven of the ten are pushed pages, and at 390
     and 834 a pushed page carries its back control above the wordmark, which
     7.6 already allows: you arrived there rather than switched to it. In the
     title block that control is one more object stacked above the date box, so
     a fixed 68 aligned the sheet to the wordmark on those screens instead of
     to the date, and fix 1 read as broken on seven of twelve screens.
     THE RULE, STATED ONCE: THE PAGE'S FIRST OBJECT STARTS ON THE LINE OF THE
     TITLE BLOCK'S SECOND OBJECT. On a destination the second object is the
     date box or the zoom control. On a pushed page with a page title it is
     still the date box, one back control lower. On a pushed page with no page
     title, which is /talk, an answer and a day, the second object IS the date
     box or the question, so the lead loses the wordmark instead.
     Four cases, each summed from tokens rather than typed:
       .page                     wordmark + second-row object          68
       .page.pushed              back + wordmark + second-row object  126
       .page.pushed.untitled     back + second-row object              78
       .page.bare                no title block at all                  0
     .bare is presentation only: the states pack crops nine of its ten states
     to the object being shown, exactly as .app.clip does, and a crop with no
     title block has nothing to align to. No shipped screen uses it.
     IT MOVES FROM .sheet TO THE PAGE'S FIRST CHILD, because the sheet is not
     always first: Ask puts its search row there, first run its opening line,
     the upgrade screen its progress bar and the guest state its notice. A
     .stack is excluded because it centres itself in the page and has no top
     edge to align. Verified inert on 01-today and 02-timeline by pixel diff,
     where the first child is the sheet and the lead is unchanged at 68. */
  .journal-app .page{--lead:calc(var(--s7) + var(--t-mast) + var(--s6))}
  .journal-app .page.pushed{--lead:calc(var(--s7) + var(--tap) + var(--s6)
                           + var(--t-mast) + var(--s6))}
  .journal-app .page.pushed.untitled{--lead:calc(var(--s7) + var(--tap) + var(--s6))}
  .journal-app .page.bare{--lead:0px}
  /* .page:not(.split) IS NOT TIDINESS AND THE PIXEL DIFF FOUND IT.
     A split page carries the lead as its own grid padding, so a first child
     that also took it as a margin was inset TWICE. Written first as a reset
     inside the split block, which lost on specificity: .page.split > * is
     three tens against this selector's four, and Timeline's sheet dropped 68px
     while every other number on the screen stayed identical. Excluding the
     split here states the rule once instead of undoing it later, and it does
     not depend on source order. */
  .journal-app .page:not(.split) > :first-child:not(.stack){margin-top:var(--lead)}
  .journal-app .sheet{margin-bottom:calc(var(--s9)*2)}
  .journal-app .title .back{display:flex;justify-content:flex-start;margin-bottom:var(--s6)}

  /* REVISION 40. A STACK IS CAPPED AND CENTRED, AND THE NUMBER IS FIX 3's.
     /talk is the one screen in the product built out of .stack, and a stack
     is width:100% of the page: 504 at tablet and 972 here. Left alone the
     capture surface becomes a 972 by 96 letterbox, the permission cards set
     their explanation at about 138 characters a line, and the three centred
     controls sit a long way from each other for no reason.
     700 IS NOT A NEW NUMBER. It is fix 3's composer, for fix 3's reason: the
     place you write is centred on the journal's own axis, and /talk is the
     place you write out loud. Both centre on 912.
     width:100% IS NOT OPTIONAL AND IT IS REVISION 20 IN A THIRD COSTUME. A
     stack is a flex item, an auto margin in the cross axis cancels stretch,
     and without the width the box would shrink to its content instead of
     taking its cap. That has now cost a measuring pass three times, so this
     one was written from the record rather than found again. */
  .journal-app .stack{width:100%;max-width:700px;margin-inline:auto}
  /* AND THE LINE THAT BELONGS TO THE STACK TAKES THE STACK'S MEASURE.
     /talk's free line is a page child rather than a stack child, because it
     sits at the foot of the page rather than in the centred block, which is
     where it sits at 390 and 834 too. Capping the stack without it left a
     972px notice under a 700px object, misaligned at both ends by 138px.
     A sibling selector says exactly what is meant and needs no :has(): a
     notice that FOLLOWS a stack is that stack's line. The transcribing state
     puts its notice inside the stack and is already 616. */
  .journal-app .stack ~ .notice{width:100%;max-width:700px;margin-inline:auto}

  /* ---- 2. the form fills the page, and so does the writing ------------- */
  /* THIS SHIPPED WRONG ONCE AND THE CORRECTION IS THE POINT OF THE COMMENT.
     Prose was first held at 416px, the measure the product reads at on both
     other platforms, on the argument that the measure must not follow the
     width. Measured on the built page that is 47% of the 884px column the
     writing sits in: every entry stopped just under halfway across a row
     whose fill and rules run the full width, which is revision 25's fault at
     a bigger scale.
     THE ARITHMETIC DEFENDING 416 WAS RIGHT ABOUT LONG-FORM AND WRONG ABOUT
     THIS. The 45 to 75 character band exists because return-sweep error
     compounds over MANY LINES. These entries are two to four lines, and the
     longest in the whole of section 8 is 175 characters, which is two lines
     at full width. The cost the band prices in is not being paid here. A rule
     was applied without checking whether its reason was present.
     The note, its summary and the rest of the subordinate prose are released
     with it, because 3.2 is a CEILING and a note narrower than the writing
     above it is the exact thing revision 25 was written to stop. All of them
     fill the same column, which is the relationship they hold at 390 and 834
     rather than a new one. Measured: 884 of 884, and the first line holds 128
     characters over 2 lines.
     THE CHARACTER COUNT IN THIS COMMENT READ 157 UNTIL SESSION 8 AND WAS WRONG.
     Re-measured on all three entries of the built screen with a Range over each
     line's own ink: longest lines 128, 124 and 89 characters, column capacity
     126 to 130. The argument does not move, because 175 characters is still two
     lines at this width, but the number was about 22% high and it was carried
     rather than measured. direction-lock.md 3.2 is now written in characters per
     line for this reason, and ch is recorded there as the unit that drifted:
     1ch is 8.875px against a real average advance of 6.814px HERE, and the
     overstatement is x1.27 to x1.34 depending on the width, so it is not a
     factor anything can be divided by. 9.13. */
  .journal-app .prose,.journal-app .said p,.journal-app .said summary,.journal-app .lede,.journal-app .card p,.journal-app .empty,.journal-app .srowlink .why{max-width:none}

  /* THE COLLAPSED NOTE ROW'S CENTRING MOVED TO THE BASE AT REVISION 48, so the
     two rules that used to sit here are gone rather than duplicated. It was
     never a desktop fault: it was a component fault that had been fixed at one
     platform because the other two were frozen. See C4 and direction-lock 6, revision 48. */

  /* ---- 3. the input box centres on the journal ------------------------- */
  /* The composer's rule still spans the page, which is what a foot does, and
     its content sits on the sheet's own vertical axis rather than against the
     sheet's left edge. 700px, because a 504 box centred under a 972 sheet
     reads as a small object adrift rather than as the place you write.
     Measured: composer centre 912, sheet centre 912. */
  .journal-app .composer{padding-inline:calc((100% - 700px)/2)}
  .journal-app .composer .crow,.journal-app .composer .opt{max-width:none}

  /* ---- REVISION 37. THE RECORD AND ITS INDEX, SIDE BY SIDE ------------- */
  /* TIMELINE STOPS BEING ONE SCREEN AT TWO ZOOMS AND BECOMES ONE SCREEN WITH
     AN INDEX. Client decision at session 6, and it is a change to what the
     calendar IS rather than to where it sits, so it is recorded as theirs.
     At 390 and 834 the two zooms are alternatives behind .seg, because there
     is only room for one of them. At 1440 there is room for both, so both are
     drawn: THE LIST IS THE RECORD AND THE CALENDAR IS AN INDEX INTO IT. Every
     day the calendar marks is a link to that day's rows in the list.
     THREE CONSEQUENCES, STATED SO THEY ARE NOT DISCOVERED LATER.
       .seg has nothing to switch here and is not on the screen. B2 still
         exists and is still Timeline's zoom control at 390 and 834; it simply
         has no job at a width that fits both. The desktop states pack has to
         follow this, because 11-states draws a Timeline.
       H2 CHANGES MEANING AT THIS PLATFORM. The calendar was a zoom level of
         the timeline; here it is a way into it. An empty day is still a number
         and nothing else, still no box, no dot, no dimming and no tap target,
         which is the part of H2 that carries the brief's rule about absence.
       A FRAGMENT LINK PUSHES A HISTORY ENTRY, and 00-flow.md section 2 kept
         zoom out of history on purpose: "pressing back four times to escape a
         screen you zoomed around in is worse than losing the ability to undo a
         zoom." Clicking three dates now does exactly that. A comp has no other
         mechanism, so the comp draws the link and THE BUILD MUST SCROLL
         WITHOUT PUSHING. Recorded in direction-lock.md 13.12 as a build
         obligation, next to the composer's label.

     THE SPLIT IS SCOPED BY A CLASS RATHER THAN BY :has(). .page is a flex
     column on every other screen and must stay one; the alternative,
     .page:has(> .cal), would put :has() into the binding stylesheet, which
     this project has kept out of shared files on purpose. Same reasoning as
     .app.clip and .crow.find, both of which are variant classes on a component
     rather than new components. Nothing is added to the inventory.

     THE LIST COLUMN IS --page-w, WHICH IS NOT A NEW NUMBER: it is the width
     the record has been read at since tablet. The index takes what is left,
     which comes to 370, and its cells to 48.6 square, clear of the 44 floor
     that H2 and 3.3 hold it to. The list is the primary object and is given
     the larger share by construction rather than by eye.

     THE GUTTER MOVES FROM THE CHILDREN TO THE PAGE. Every object in a flex
     page carries margin:0 var(--gut) to hold itself off the page edge. In a
     grid that would inset each object inside its own track and the two columns
     would no longer add up, so the page takes the gutter as padding and the
     children give up their inline margins.

     THE TOP MARGIN MOVES THE SAME WAY, AND FIX 1 STILL HOLDS. The sheet's
     68px top margin is what puts the first entry on the date box's line. In
     two columns it has to start both of them, so it becomes the grid's
     padding-top, derived from exactly the same three tokens. */
  /* REVISION 46. THE INDEX GIVES ITS SPARE WIDTH BACK TO THE RECORD, AND IT
     STOPS AT THE TAP FLOOR RATHER THAN AT THE NUMBER ASKED FOR.
     Client: make the calendar about 80% of its size so the timeline has more
     space. 80% of 370 is 296, and it cannot be built: a calendar is seven
     columns, so its cell is (W - 2 border - 16 padding - 12 gap) / 7, and at
     296 that is 38.0px against a 44px floor. THE FLOOR IS BINDING ON EVERY
     FILE, and H2 and 13.12 both hold this component to it for a reason that
     got stronger at this platform: at 390 and 834 a day cell was a link to a
     day page, and here it is the control that drives the whole screen.
     340 IS THE SMALLEST THE INDEX CAN BE. It puts the cell at 44.29, which is
     the same 44.3 section 3.3 tuned the mobile calendar to and for the same
     arithmetic. That is 92% rather than 80%, and it hands the record 30px.
     THE COLUMNS INVERT: the index takes a fixed width and the record takes
     what is left, which is the right way round now that the record is the one
     being given the room. The list goes 560 to 590, so it is no longer exactly
     --page-w; it is the width the record has been read at since tablet plus
     what the index gave back.
     IT APPLIES TO THE ANSWER'S SOURCE COLUMN TOO, deliberately. Two different
     second-column widths on one pattern is the inconsistency this project
     keeps catching, and 13.2's estimate of about 372px was never a rule. The
     source column is 340 and its sheet sets at about 44 characters. */
  .journal-app .page.split{display:grid;
              grid-template-columns:1fr 340px;
              column-gap:var(--s9);align-content:start;
              padding-inline:var(--gut);
              padding-top:var(--lead)}
  /* align-self:start ON EVERY ITEM, NOT JUST THE INDEX. A grid item stretches
     to its row by default, and the row is as tall as its tallest occupant. On
     Timeline the record is always taller than its index so nothing showed it;
     on an answer the source column can be taller than the answer, and the
     answer's sheet stretched to match, drawing 90px of empty ruled box under
     the note. Found by looking at the render, not by measuring: every number
     on the page was correct. */
  .journal-app .page.split > *{grid-column:1;margin-inline:0;align-self:start}
  .journal-app .page.split > .foot{padding-inline:0}

  /* The index sits at the top of its column and stays with the record while
     the record scrolls, which is the whole reason it is an index and not a
     second page. Sticky is constrained to its own grid area, so it travels
     with the list and stops at the end of it. align-self:start is not
     optional: a stretched grid item cannot stick.
     IT CANNOT BE DEMONSTRATED IN A STATIC COMP, which is the same honest
     limitation .composer's sticky foot has had since Stage 3.

     REVISION 41. THE SECOND COLUMN TAKES A PANEL AS WELL AS THE INDEX, WHICH
     IS SECTION 13.2 ARRIVING AT THE SCREEN THAT NEEDED IT.
     13.2 specified a sheet opening in the right-hand cream margin, and the
     shell that was chosen has no cream margin, so the client settled it at
     session 6: A CITATION OPENS AS A RIGHT-HAND COLUMN, THE SAME .page.split
     Timeline uses for its index. 04-ask builds it, which is why it was not
     declared here in advance of a deliverable that renders it.
     NO NEW COMPONENT. G1 .panel is the citation footnote already, on every
     platform and in 00-flow.md section 1. At 390 and 834 it slides over the
     page and Back closes it; here it stops sliding over and sits beside,
     which is layout and navigation chrome and is allowed to change per
     platform. The inventory stays at 37.
     IT HAS TO STOP BEING ABSOLUTE. .panel is positioned against .app with
     left, right and bottom set, which is how it covers the foot of a page at
     390. As a grid item it takes its own track, so all three are released and
     sticky replaces absolute. THE PAGE DOES NOT MOVE WHEN IT OPENS, which is
     the whole of what 13.2 asked for and is stricter than a history entry can
     give: the answer holds a 560 column whether anything is open or not.
     The cost, stated rather than discovered: on an answer with nothing open
     the second column is empty. It is the one screen in the product that
     reserves space for something that is not always there, and reserving it
     is exactly what stops the answer moving under the reader. */
  .journal-app .page.split > .cal,.journal-app .page.split > .panel{grid-column:2;grid-row:1;
                     align-self:start;position:sticky;top:var(--s9);
                     left:auto;right:auto;bottom:auto}
  /* AND IT HAS TO STOP BEING A FILLED BLOCK. At 390 the panel lays --paper
     over the foot of the page and draws one hairline along its top edge,
     which is what a thing sliding up from the bottom looks like. Beside the
     page that same fill is a rectangle of page colour laid over the graph
     with no edge on three sides, which reads as an erased patch rather than
     as an object. On this shell every object sits ON the graph and carries
     its own fill and keyline, so the panel gives up both and lets the keybox
     and the sheet inside it be the objects, exactly as the page does.
     Its children give up their inline margins for the same reason the page's
     children do: the column is already the measure. */
  .journal-app .page.split > .panel{background:none;border-top:0;padding:0}
  .journal-app .page.split > .panel > *{margin-inline:0}
  /* AND ITS SHEET IS NOT THE PAGE'S SHEET. Fix 1 gives every sheet on this
     platform an 84px bottom margin, which is right for the foot of a page and
     wrong inside a 370px column, where it threw the close control 84px clear
     of the object it closes and the panel read as two unrelated things. */
  .journal-app .page.split > .panel > .sheet{margin-top:var(--s6);margin-bottom:var(--s5)}

  /* A row reached from the index should not land flush against the top of the
     window. --s9 is the page's own gutter, so the row arrives inset by the
     same measure the page is. */
  .journal-app .page.split .sheet > [id]{scroll-margin-top:var(--s9)}

  /* ---- no heading default leaks into a scale with no weight axis -------
     ALL OF THIS MOVED TO THE BASE AT REVISION 48 AND THE RULE THAT SAT HERE IS
     DELETED. What follows is kept as the argument, because it is where the
     argument was first made and 9.17 later extended it to .shead and .card h3. */
  /* direction-lock 6 revision 48 items 2 and 3, fixed DESKTOP ONLY by client decision.
     .moodrow h2 sets family, size, line height, colour and margin and never
     set a weight, so the browser's bold default leaked and the one hand-set
     question in the product has been drawing in SYNTHESISED BOLD INK FREE
     since Stage 1, on every platform, hidden by a script face. The type scale
     in direction-lock.md 3.1 has no weight axis at all; the only deliberate
     weight in this stylesheet is 600 on .cite.
     .wordmark needs the same declaration for the same reason, because it
     becomes the h1 in the desktop markup and an h1 is bold by default.

     REVISION 42 EXTENDS IT TO THE OTHER TWO OBJECTS THAT CAN BE THE h1.
     Three of the ten screens built this session have no wordmark at all: on
     /talk, on an answer and on a past day the page is named by its date box or
     by the question, exactly as 7.6 describes the masthead's second row. Those
     screens carried no h1 at 390 and 834 either, which is 9.14 defect 3 again,
     and the same client decision applies: fixed on desktop, reported on the
     other two. So the object that names the page becomes the h1 there, and the
     weight is declared on THE OBJECT rather than on the element, because the
     whole of defect 2 was a heading default leaking into a scale that has no
     weight axis. .keybox .v and .glance already compute 400 as a span and a
     paragraph; saying so is what stops them computing 700 the moment either
     becomes a heading. Verified by pixel diff: 28 of 28 unmoved. */
}


/* ==========================================================================
   6. MOBILE APP, 390x844, iOS. STAGE 5.
   REVISION 47.

   THIS IS A VARIANT CLASS AND NOT A FOURTH CONTAINER QUERY, AND THAT IS A
   CORRECTION TO THE RECORD RATHER THAN A PREFERENCE.
   PROJECT.md's Stage 5 note and direction-lock 13.6 both say the native pass adds
   "a fourth container query". IT CANNOT. Sections 4 and 5 are keyed on how wide
   .app is, and THE MOBILE APP IS 390 WIDE AND SO IS MOBILE WEB. There is no
   width at which one is true and the other is false, so no width query can tell
   them apart. What separates them is not a size, it is a platform, and a
   platform is a fact about the file rather than about its measurements.
   So the native block is .app.ios, and the precedent is already in this file
   three times: .app.clip, .crow.find and .page.split are all variant classes on
   an existing component rather than new components. NOTHING IS ADDED TO THE
   INVENTORY, WHICH STAYS AT 37.
   THE PATTERN THAT HELD THREE TIMES WAS NOT THE RULE. Mobile web, tablet and
   desktop are three widths of one product, so a width query was the right
   instrument for all three; native is a different product surface at a width
   that is already taken. Same class of mistake as the gutter series in 13.1,
   where 14 and 28 looked like they implied 42.

   ONE CONSEQUENCE, AND IT IS THE GOOD KIND. Sections 4 and 5 are container
   queries on .app, and .app here is 390, so NEITHER FIRES. The native block
   sits on top of the base, which is the mobile design, and it only has to say
   what the platform changes. That is the same additive relationship section 5
   has with section 4, arrived at by a different mechanism.

   A NOTE ON THE CONSTRAINT THIS BLOCK DOES *NOT* INHERIT, because it will
   matter at the tablet app. Sections 4 and 5 may not style .app itself, since
   an element cannot query itself. PROJECT.md carries that constraint forward onto
   the native block as though it were general. IT IS NOT: a variant class has no
   self-reference to create, so .app.ios could legitimately style .app. It did
   not need to here, because holding .page to the screen gives .app its height
   by construction, so the block is all descendants anyway and the question
   never arose. Recorded so the tablet app does not obey a rule whose reason is
   absent, which is the fault this project has now caught seven times.

   ------------------------------------------------------------------------
   THE PROBLEM THIS BLOCK EXISTS TO SOLVE
   00-flow.md section 2 put the four destinations at the TOP on mobile web, and
   gave two reasons: "the bottom of Today belongs to the composer and the mic",
   and stacking a nav bar under them "inside a browser that has already taken
   100px of vertical space" produces a 45%-tall content area. The native delta
   in the same paragraph then turns that top row into a real UITabBar, which is
   at the BOTTOM. So the composer and the tab bar want the same edge.

   THE SECOND REASON IS VOID AT NATIVE AND THE FIRST IS NOT. There is no browser
   chrome to pay for. The composer still wants the foot.

   THE COLLISION RESOLVES, AND IT RESOLVES BY ARITHMETIC RATHER THAN BY TASTE.
   The destination row is 58px tall and it is INSIDE the scrolling page on
   mobile web. At native it stops being page content and becomes the tab bar, so
   the page gets it back. Measured on the built files, at rest, top of the day:

     mobile web   app 764   mast 124 + dest 58 + glance 37.56 + margin 14
                            composer 135        SHEET VISIBLE  395.44
     mobile app   page 714  mast 124 + glance 37.56 + margin 14
                            composer 135        SHEET VISIBLE  403.44

   THE NATIVE SCREEN SHOWS EIGHT MORE PIXELS OF THE DAY THAN THE WEB ONE, while
   carrying a permanent tab bar the web one does not have. The tab bar costs 83;
   the destination row it replaces cost 58 in the page, and the browser furniture
   it does not have cost 80 against the 47 of status bar native still pays. 58
   plus 33 is 91, against 83. The change is +8.

   AND THE HONEST OTHER HALF, STATED RATHER THAN LEFT TO BE FOUND. Once you
   scroll, mobile web pays nothing at the top because its masthead and its
   destinations scroll away, while native pays a 44px collapsed bar and an 83px
   tab bar forever:

     mobile web, scrolled    629 of reading area
     mobile app, scrolled    535 of reading area        94 LESS

   So native is better at the top of the day and worse down it, and the trade is
   the platform's rather than this design's. WHAT THE 94px BUYS IS A SENTENCE
   THE FLOW HAS ASSERTED SINCE STAGE 0 AND NO PLATFORM HAS YET HONOURED:
   00-flow.md section 2 says the four destinations are "one tap from anywhere".
   On mobile web, on a day like this one, that is false: the day is 1168 tall in
   a 764 window, so from its foot the destination row is a 404px scroll and THEN
   a tap. The tab bar is what makes the flow's own sentence literally true for
   the first time.

   THE MASTHEAD DOES NOT MOVE, AND THAT IS THE FINDING RATHER THAN A GAP.
   The native delta asks for "a large title that collapses on scroll". The
   wordmark is already --t-mast, 34px, set flush left with the date box beneath
   it, and 34px is iOS's own large-title size. AT REST THE MOBILE WEB MASTHEAD
   IS ALREADY A LARGE TITLE and needs no declaration at all. The whole of the
   delta is the collapsed state, which is .mast.collapsed below. Rule 7.6 still
   binds: the masthead is 124 on every destination, so the date box does not
   move when you change tab.
   ========================================================================== */

/* ---- the screen ------------------------------------------------------- */
/* THE PAGE IS THE SCREEN BETWEEN THE TWO BARS, and its height is summed from
   the four native dimensions rather than typed, so it follows if any of them
   move. 844 - 47 - 49 - 34 = 714.
   HEIGHT RATHER THAN min-height, WHICH LOOKS LIKE IT BREAKS 3.3 AND DOES NOT.
   3.3 says no fixed heights on anything carrying text, because text that grows
   under enlarged type must be able to push its box. THIS BOX CARRIES NO TEXT:
   natively it is the scroll view, its height IS the screen, and the sheet
   inside it is the thing that grows and scrolls. min-height would be the wrong
   description of a native scroll view, not a safer one. Ask what the number is
   a proxy for: 3.3's reason is absent here and present on every box inside.
   overflow:hidden IS THE COMP, NOT THE BUILD. In the build this is a scrolling
   view. A static file cannot scroll, so the comp draws the phone truthfully by
   cutting the day exactly where the screen cuts it, and a second device shows
   the second scroll position. Drawing the whole day instead would put the tab
   bar 1138px down the page, which is nowhere it ever is. MEASURED on the built
   file rather than estimated: the page's scrollHeight is 1138 against its 714. */
.journal-app .app.ios .page{
  --screen-h:844px;                /* the tablet app overrides this and nothing else */
  height:calc(var(--screen-h) - var(--safe-t) - var(--tabh) - var(--safe-b));
  overflow:hidden;
}

/* THE BINDING STOPS AT THE TAB BAR, AND THIS IS THE .app TRAP ARRIVING ON ITS
   FOURTH PLATFORM. .rail is absolutely positioned in .app with bottom:0, which
   was right for three platforms because .app and the page ended on the same
   line. They no longer do: the tab bar is a sibling of the page, so bottom:0
   runs the spiral down behind the tab bar. The spiral binds the PAPER. A tab
   bar is not paper, it is the system's furniture sitting under the notebook.
   Revisions 22, 44 and this one are the same object at 834, 1440 and native. */
.journal-app .app.ios .rail{bottom:calc(var(--tabh) + var(--safe-b))}

/* ---- the tab bar ------------------------------------------------------ */
/* B1 UNCHANGED: four destinations, always four, always in the same order. What
   changes is chrome and layout, both of which the engagement rules allow to
   move per platform. .dest.tab is a variant class, so the component is the one
   the other three platforms draw.
   IT SPANS THE FULL 390. .app carries padding-left:--rail, so a child stops at
   the paper's left edge; a tab bar does not. The negative margin is exactly the
   rail, so the number cannot drift from it.
   THE SELECTED ITEM KEEPS ITS FILL AND ITS INVERTED LABEL. iOS marks the
   current tab by tinting it, which is colour alone, and rule 2.4 forbids that
   outright. So the current destination stays --block ground with a --paper
   label at 8.89:1, exactly as on the other three platforms, and it survives
   greyscale. THIS IS THE ONE PLACE THE NATIVE PASS DECLINES A PLATFORM
   CONVENTION, and it declines it on a binding rule rather than on taste.
   NO ICONS. An iOS tab bar is normally an icon over a label. This product's
   standing rule is to reach for a printed word before inventing an icon, it has
   exactly two glyphs and both are universal, and four invented marks for four
   destinations is four chances to be decoded wrongly. The bar is words. */
/* THE BAR CARRIES THE HEIGHT, NOT ITS ITEMS, AND THAT IS RULE 7.6's LESSON
   ARRIVING IN A THIRD PLACE. Written first as min-height:--tabh on each item,
   which measured the bar at 84 rather than 83: the item's 49 sits INSIDE the
   bar's own 1px hairline, so the bar came out a pixel over and the binding
   overshot its top edge by exactly that pixel. It is the same mistake 7.6
   records against .seg, where giving the children --ctl pushed the container to
   52. The bar takes min-height and everything is border-box, so the hairline and
   the 34px of home indicator are inside the 83 and the items stretch to 48,
   still 4 clear of the --tap floor. min-height rather than height, so labels
   under enlarged type push the bar taller instead of clipping. */
.journal-app .app.ios .dest.tab{
  margin-left:calc(var(--rail) * -1);
  min-height:calc(var(--tabh) + var(--safe-b));
  gap:0;
  padding:0 0 var(--safe-b);
  position:relative;
  background:var(--paper-2);
  border-top:var(--w) solid var(--rule);
}
/* min-width:min-content IS THE 200% TYPE FIX, AND IT IS THE EQUAL DIVISION THAT
   BREAKS RATHER THAN THE WIDTH. Measured at 200% with the device held at 390:
   TIMELINE needs 101px of a 97.25px column and it is ONE WORD, so it cannot
   wrap; it spilled over the tab beside it. .dest a has overflow:visible, so it
   was not clipping and a clipping check could not see it. Only asking each tab
   for its scrollWidth against its clientWidth found it.
   THE FOUR LABELS DO FIT AT 200%: TODAY, TIMELINE, ASK and YOU come to about
   301px of 390 with their padding. What did not fit was one QUARTER of 390.
   So the basis stays 0 and the items still grow to an equal 97.25 while there is
   room, and min-content stops any of them being pushed narrower than its own
   word: at 200% TIMELINE claims 113 and the other three share 277.
   THE --tap FLOOR IS NOT LOST WITH THE BASE min-width. Four equal columns of 390
   are 97.5 each, so the floor is satisfied by the geometry rather than by a
   declaration, and it is measured on every render. */
.journal-app .app.ios .dest.tab a{
  flex:1 1 0;
  min-width:min-content;
  padding:0 var(--s3);
  background:none;
  border:0;
  border-radius:0;
}
/* AND THE CURRENT DESTINATION HAS TO BE RESTATED, WHICH IS THE ONE THING IN
   THIS BLOCK THAT ONLY A RENDER COULD HAVE CAUGHT.
   The rule above is four classes and beats the base's
   .dest a[aria-current="page"] on specificity, so background:none won and the
   fill disappeared, while the base's color:var(--paper) did NOT lose and kept
   applying. The current tab drew --paper text on a --paper-2 bar: 1.08:1, an
   invisible label on the one item that has to be legible.
   THE COMMENT ABOVE ASSERTED THIS RULE BEFORE THE SELECTOR EXISTED, which is
   revision 35's fault exactly: prose describing behaviour the selectors do not
   have. Found by looking at the render. */
.journal-app .app.ios .dest.tab a[aria-current="page"]{background:var(--block);color:var(--paper)}
/* REVISION 28 SURVIVES, IN A DIFFERENT MECHANISM AND FOR THE SAME REASON.
   You is set apart because it is the only destination that is about the
   software rather than about the writing. On the web platforms that is said
   with an auto left margin, which cannot be said in a bar whose four items
   divide it equally, and equal division is what a tab bar IS. The hairline says
   the same thing in the product's own vocabulary: one weight, one colour, and
   it survives greyscale. The HIERARCHY is held identical across platforms, as
   the rules require; only the mechanism is chrome, which is allowed to change.
   REJECTED: keeping the auto margin. It leaves a 107px hole in a 390px bar and
   reads as a layout fault rather than as a statement. */
/* :last-of-type AND NOT :last-child, WHICH COST A MEASURING PASS. The bar's
   last child is the decorative home indicator, not a destination, so
   a:last-child matched NOTHING and the divider silently never drew. The base's
   own .dest a:last-child{margin-left:auto} was disabled by the same span, which
   is why the four items divided equally and the bar LOOKED right: two rules
   failed and the failure of one hid the failure of the other. The span is now
   the bar's first child as well, so the base rule behaves, and this selector no
   longer depends on where it sits. A DECORATIVE ELEMENT INSIDE A COMPONENT CAN
   BREAK A STRUCTURAL SELECTOR IN THAT COMPONENT, and nothing on the screen says
   so. */
.journal-app .app.ios .dest.tab a:last-of-type{margin-left:0;border-left:var(--w) solid var(--rule)}
/* border-color is deliberately NOT reset here. The base hover sets it, and this
   selector is five classes, so resetting it would erase the You divider on
   hover: the one hairline in the bar would vanish exactly when a pointer asked
   about the item it sets apart. */
.journal-app .app.ios .dest.tab a:hover:not([aria-current]){background:var(--paper)}

/* THE SHEET MUST NOT SHRINK, AND ONLY MEASURING FOUND IT.
   .page has a real height here, and .sheet is a flex item with the default
   flex:0 1 auto, so the day is TALLER THAN THE PAGE and flex resolved that by
   SHRINKING THE SHEET rather than by letting it overflow: measured 389.44
   against a natural 813.13, with its own rows spilling out of it. The render
   looked almost correct, because the page clips at the same line either way.
   WHAT GAVE IT AWAY WAS A HAIRLINE. A shrunk sheet draws its bottom border at
   565, just above the composer, so the screen stated that the day ENDED there.
   A cut-off day and a finished day are different claims about the record, and
   this file was making the wrong one 400px early.
   flex-shrink:0 lets the sheet keep its height and the page do the cutting,
   which is what a scroll view does. THIS IS THE FOURTH TIME AN AUTO OR DEFAULT
   FLEX VALUE HAS COST A PASS in this project, after revision 20, W2's band and
   .stack: revision 20 was stretch cancelled by an auto margin, this is shrink
   applied where overflow was meant. */
.journal-app .app.ios .page > .sheet{flex-shrink:0}

/* ---- the large title, collapsed --------------------------------------- */
/* THE SECOND HALF OF THE NATIVE DELTA, AND THE ONLY HALF THAT NEEDED CSS.
   Scrolled, the large title leaves and the wordmark returns as an inline title
   in a 44px bar that stays. --t-field is the size, because the type scale has
   no 17px and does not need one: this is the same printed treatment
   .keybox .v.printed already uses, so no token is added.
   The date box, the glance line and the sheet all scroll UNDER it, which is
   what an iOS navigation bar does and what the mobile web masthead cannot do,
   because nothing on a web page here is fixed except the composer. */
.journal-app .app.ios .mast.collapsed{
  position:sticky;top:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  min-height:var(--navh);
  padding:0 var(--gut);
  background:var(--paper);
  border-bottom:var(--w) solid var(--rule);
}
.journal-app .app.ios .mast.collapsed .wordmark{
  font-size:var(--t-field);
  line-height:var(--lh-tight);
  margin-bottom:0;
}

/* PRESENTATION ONLY: THE PAGE DRAWN AT THE FOOT OF ITS SCROLL.
   No shipped screen uses this, exactly as with .app.clip and .page.bare. A
   static file cannot scroll, and the second device has to show a REACHABLE
   scroll position rather than a plausible-looking one.

   TWO ATTEMPTS BEFORE THIS ONE, AND BOTH WERE RENDERED AND LOOKED AT.
   1. AUTHOR A SUBSET OF THE ROWS. Wrong in both directions, and the arithmetic
      says why: the visible sheet area when the title has collapsed is 521, and
      the day's rows from the recording onward are 548.75. Too few rows and the
      sheet underflows, leaving 226px of empty graph above the composer, which is
      a position no scroll offset can reach. Too many and the mood row is sliced
      by the composer. Rendered: the chips came out cut in half.
      IT IS ALSO NOT A FREE CHOICE. The mood row is the LAST object in the day
      and the composer covers the last 135px of the page, so the mood row is
      fully clear of it at exactly one scroll position, the last one. Any comp
      that has to show the mood row has to show max scroll.
   2. justify-content:flex-end, which SHOULD need no number at all: a flex column
      that overflows an end-justified container overflows its start edge, so the
      day would run off the TOP and be clipped there, which is what scrolling
      down is. IT DOES NOT WORK, and the reason is worth keeping: .page is a
      scroll container, and Chromium clamps overflow alignment in a scroll
      container so the content's start edge stays reachable. flex-end silently
      behaves as flex-start and the render was identical to the unscrolled
      device. A CORRECT-LOOKING RULE THAT THE ENGINE DECLINES TO APPLY IS
      INVISIBLE IN THE SOURCE AND OBVIOUS IN THE RENDER.

   SO THE OFFSET IS MEASURED, AND IT IS HONEST THAT IT IS. --overflow is the
   day's own overflow past the screen: collapsed bar 44, sheet 813.13, its 14
   margin and the composer's 135 come to 1006.13 against a 714 page, so 292.
   IT WAS 263 UNTIL THE SHEET WAS MEASURED. 263 came from the sheet's height at
   390 WEB, 785.13, carried across rather than read off this file, and it clipped
   the mood chips by 14.12. CARRYING A HEIGHT FROM THE PLATFORM NEXT DOOR IS THE
   SAME FAULT AS CARRYING A ch VALUE.
   THE DIFFERENCE THAT CAUSED IT NO LONGER EXISTS, AND 292 IS STILL RIGHT. At the
   time the shut note row was 68 here and 54 at 390 web, because 9.14 defect 4
   was fixed on native and not there, so the native sheet was 28 taller and the
   day scrolled 29 further. REVISION 48 FIXED DEFECT 4 EVERYWHERE, so the row is
   68 on all four platforms and both sheets measure 813.13. The offset does not
   move, because it was read off THIS file rather than carried across, which is
   the whole point of the paragraph above.
   A SCROLL POSITION IS CONTENT-DEPENDENT BY NATURE and cannot be summed from
   tokens the way fix 1's lead can; pretending otherwise would be the fourth
   time this project mistook a number for a derivation. It is stated here, on a
   presentation class, rather than typed into a file as an override.
   WHAT IT BUYS: the second device carries THE SAME SIX ROWS as the first,
   verbatim, rather than a hand-picked subset, so content against content is
   identical by construction instead of by checking. */
.journal-app .app.ios .page.scrolled{--overflow:292px}
.journal-app .app.ios .page.scrolled > .sheet{margin-top:calc(var(--overflow) * -1)}

/* ---- THE FOUR CROSS-PLATFORM DEFECTS ARE CLOSED, AND THIS BLOCK NO LONGER CARRIES ANY OF IT ----
   THE FOUR RULES THAT SAT HERE ARE GONE AT REVISION 48, and so is the reason
   they were here. When this section was written the four cross-platform defects
   were fixed at 1440 only, by client decision, and 390 and 834 kept them, so a
   native comp had to pick a side and picked fixed. That produced the split this
   comment used to have to warn about: the mood question at 400 on two platforms
   and 700 on the other two.
   THE CLIENT LIFTED THAT AT SESSION 10 AND ALL FOUR ARE NOW FIXED EVERYWHERE,
   in the base rather than in three platform blocks saying the same thing. So
   these declarations became duplicates of the base and were deleted rather than
   left to rot, which is the fault revision 35 caught in section 5f.
   AND <time datetime> IS BUILT. It was reported at session 5 and left unfixed
   on every platform for the good reason that it had no decision behind it, so
   fixing it on native alone would have been taking one. The polish pass took it
   across all four platforms at once, which is the only way it was ever going to
   land. See direction-lock 6, revision 48. */
